<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档框架编辑器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<style>
:root {
  --bg: #faf7f2;
  --bg2: #f4efe6;
  --bg3: #ede5d8;
  --border: #d4c8b8;
  --border2: #c4b5a0;
  --text: #2d2420;
  --text2: #5c4f44;
  --text3: #8c7d70;
  --accent: #c9536a;
  --accent2: #e8768a;
  --accent-pale: #f9e8eb;
  --toolbar-h: 52px;

  /* 15-color palette — sakura-chroma inspired, each with L1/L2/L3 shades */
  --c1-l1:#c9536a; --c1-l2:#e8a0ac; --c1-l3:#f7dde1;   /* 樱桃粉 */
  --c2-l1:#7b5ea7; --c2-l2:#b09bd0; --c2-l3:#e3daf0;   /* 紫藤 */
  --c3-l1:#3d7ebf; --c3-l2:#82b0d8; --c3-l3:#d0e4f2;   /* 瓷青 */
  --c4-l1:#2a8a6e; --c4-l2:#72bda8; --c4-l3:#c6e8df;   /* 翠竹 */
  --c5-l1:#c47c2b; --c5-l2:#e0ae72; --c5-l3:#f5e3c6;   /* 秋柿 */
  --c6-l1:#b5485a; --c6-l2:#d98896; --c6-l3:#f2d4d9;   /* 绛红 */
  --c7-l1:#5478b0; --c7-l2:#8eaad4; --c7-l3:#d4e0f0;   /* 石青 */
  --c8-l1:#6b8e3e; --c8-l2:#9fc070; --c8-l3:#daecc4;   /* 竹绿 */
  --c9-l1:#9e5a8e; --c9-l2:#c896bc; --c9-l3:#eedde8;   /* 牡丹 */
  --c10-l1:#3a6e8a;--c10-l2:#74adc4;--c10-l3:#c6dfe9;  /* 青瓷 */
  --c11-l1:#a86430;--c11-l2:#cf9e6e;--c11-l3:#ecdcc4;  /* 琥珀 */
  --c12-l1:#527a5a;--c12-l2:#88b090;--c12-l3:#cfe3d2;  /* 松绿 */
  --c13-l1:#7a4e7a;--c13-l2:#b088b0;--c13-l3:#e2d0e2;  /* 紫苏 */
  --c14-l1:#486878;--c14-l2:#82a8b8;--c14-l3:#ccdde5;  /* 蓝灰 */
  --c15-l1:#8a6040;--c15-l2:#bc9874;--c15-l3:#e8d8c4;  /* 茶棕 */
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── TOOLBAR ── */
.toolbar {
  height: var(--toolbar-h);
  background: var(--bg2);
  border-bottom: 1.5px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  flex-shrink: 0;
  position: relative;
}
.toolbar-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: .03em;
  margin-right: 8px;
  white-space: nowrap;
}
.toolbar-title span {
  color: var(--accent);
}
.tb-sep { width: 1px; height: 22px; background: var(--border2); margin: 0 4px; }
.tb-btn {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 11px;
  border-radius: 5px;
  border: 1.5px solid var(--border2);
  background: var(--bg);
  color: var(--text2);
  font-size: 12.5px;
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.tb-btn:hover { background: var(--bg3); border-color: var(--accent2); color: var(--accent); }
.tb-btn.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 500;
}
.tb-btn.primary:hover { background: #b8425a; }
.tb-btn svg { flex-shrink: 0; }

/* ── MAIN LAYOUT ── */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── EDITOR PANEL ── */
.editor-panel {
  width: 38%;
  min-width: 300px;
  display: flex;
  flex-direction: column;
  border-right: 1.5px solid var(--border);
  background: var(--bg);
}
.panel-header {
  height: 36px;
  display: flex; align-items: center;
  padding: 0 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text3);
  letter-spacing: .05em;
  gap: 8px;
}
.panel-header-hint {
  margin-left: auto;
  font-size: 10.5px;
  color: var(--text3);
  opacity: .7;
}
.editor-wrap {
  flex: 1;
  overflow: hidden;
  position: relative;
}
#md-editor {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  padding: 14px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  line-height: 1.85;
  color: var(--text);
  tab-size: 2;
}
#md-editor::placeholder { color: var(--text3); opacity: .5; }

/* ── MINDMAP PANEL ── */
.map-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}
.map-controls {
  height: 36px;
  display: flex; align-items: center;
  padding: 0 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.map-ctl-btn {
  width: 26px; height: 26px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--text2);
  cursor: pointer;
  font-size: 14px;
  display: flex; align-items: center; justify-content: center;
  transition: all .12s;
}
.map-ctl-btn:hover { background: var(--bg3); color: var(--accent); }
.map-ctl-btn.active {
  background: var(--accent-pale);
  color: var(--accent);
  border-color: var(--accent2);
}
.map-theme-select {
  height: 26px;
  max-width: 132px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--bg);
  color: var(--text2);
  font-size: 11px;
  font-family: 'Noto Sans SC', sans-serif;
  padding: 0 6px;
  outline: none;
}
.map-theme-select:focus {
  border-color: var(--accent2);
  box-shadow: 0 0 0 2px var(--accent-pale);
}
.presentation-status {
  min-width: 42px;
  font-size: 11px;
  color: var(--accent);
  font-family: 'JetBrains Mono', monospace;
  text-align: center;
}
.map-legend {
  margin-left: auto;
  display: flex; align-items: center; gap: 10px;
  font-size: 11px; color: var(--text3);
}
.legend-item { display: flex; align-items: center; gap: 4px; }
.legend-dot {
  width: 10px; height: 10px;
  border-radius: 2px;
}
#map-canvas {
  flex: 1;
  overflow: hidden;
  position: relative;
  cursor: grab;
}
#map-canvas:active { cursor: grabbing; }
#map-svg {
  position: absolute;
  top: 0; left: 0;
  z-index: 1;
  will-change: transform;
  transform-origin: 0 0;
}
.map-layout-switch {
  position: absolute;
  right: 14px;
  bottom: 14px;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px;
  background: rgba(250,247,242,.92);
  border: 1px solid rgba(184,165,150,.75);
  border-radius: 8px;
  box-shadow: 0 6px 20px rgba(45,36,32,.12);
  z-index: 8;
  pointer-events: auto;
}
.map-layout-btn {
  min-width: 52px;
  height: 28px;
  padding: 0 10px;
  border-radius: 6px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text3);
  font-size: 11px;
  cursor: pointer;
  transition: all .12s;
}
.map-layout-btn:hover {
  background: rgba(255,255,255,.85);
  color: var(--accent);
}
.map-layout-btn.active {
  background: var(--accent-pale);
  border-color: var(--accent2);
  color: var(--accent);
}

/* ── LEVEL LEGEND PANEL ── */
.level-hint {
  padding: 4px 14px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; flex-wrap: wrap;
  font-size: 10.5px; color: var(--text3);
}
.level-hint span { display: flex; align-items: center; gap: 3px; }
.lh-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--bg3);
  padding: 0 4px;
  border-radius: 3px;
  color: var(--text2);
}

/* ── NODE STYLES (SVG foreign object) ── */
.node-box {
  display: flex; align-items: center;
  border-radius: 5px;
  padding: 5px 10px;
  cursor: pointer;
  user-select: none;
  position: relative;
  transition: opacity .15s;
  white-space: nowrap;
  border: 1.5px solid transparent;
}
.node-box:hover { filter: brightness(.95); }
.node-label {
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 12px;
  line-height: 1.4;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 130px;
  flex: 1;
  cursor: text;
}
.node-label:hover { text-decoration: underline dotted; }
.node-type-badge {
  margin-left: 5px;
  font-size: 9.5px;
  padding: 1px 4px;
  border-radius: 3px;
  background: rgba(255,255,255,.45);
  color: inherit;
  opacity: .8;
  font-family: 'JetBrains Mono', monospace;
  flex-shrink: 0;
}
.node-toggle {
  width: 14px; height: 14px;
  border-radius: 50%;
  background: rgba(255,255,255,.6);
  border: 1px solid rgba(0,0,0,.15);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px;
  margin-left: 4px;
  flex-shrink: 0;
  cursor: pointer;
}
/* Body expand button on heading node */
.node-body-btn {
  width: 14px; height: 14px;
  border-radius: 3px;
  background: rgba(255,255,255,.5);
  border: 1px solid rgba(0,0,0,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; line-height: 1;
  margin-left: 4px;
  flex-shrink: 0;
  cursor: pointer;
  user-select: none;
}
.node-body-btn:hover { background: rgba(255,255,255,.8); }

/* ── MODAL OVERLAY ── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(45,36,32,.4);
  backdrop-filter: blur(3px);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none;
  transition: opacity .2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 40px rgba(0,0,0,.18);
  width: 680px;
  max-width: 95vw;
  max-height: 85vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.modal-header {
  padding: 16px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 600;
}
.modal-close {
  width: 28px; height: 28px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: none;
  cursor: pointer; font-size: 14px; color: var(--text3);
}
.modal-close:hover { background: var(--bg3); color: var(--text); }
.modal-body {
  flex: 1; overflow-y: auto;
  padding: 16px 20px;
}
.modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}

/* Export modal styles */
.export-section { margin-bottom: 18px; }
.export-section-title {
  font-size: 11px; font-weight: 600;
  color: var(--text3); letter-spacing: .08em;
  text-transform: uppercase;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.export-section-title span { font-weight: 400; text-transform: none; font-size: 11px; color: var(--text3); opacity: .75; }

/* Preset chips */
.preset-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.preset-chip {
  padding: 4px 10px; border-radius: 20px;
  border: 1.5px solid var(--border2); background: var(--bg2);
  font-size: 11.5px; cursor: pointer; transition: all .12s;
  color: var(--text2); user-select: none;
}
.preset-chip:hover { border-color: var(--accent2); color: var(--accent); background: var(--accent-pale); }
.preset-chip.active { border-color: var(--accent); background: var(--accent-pale); color: var(--accent); font-weight: 500; }

/* Field list */
.field-list { display: flex; flex-direction: column; gap: 5px; }

/* Field row */
.field-row {
  display: flex; align-items: stretch;
  border-radius: 7px; background: var(--bg2);
  border: 1.5px solid var(--border); overflow: hidden;
  transition: border-color .12s, box-shadow .12s;
  cursor: default;
}
.field-row.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-pale); }
.field-row.dragging { opacity: .3; border-style: dashed; }
.field-row.drop-above { box-shadow: 0 -2px 0 0 var(--accent); }
.field-row.drop-below { box-shadow: 0 2px 0 0 var(--accent); }
.field-row.drag-over { box-shadow: 0 2px 0 0 var(--accent); background: var(--accent-pale) !important; border-color: var(--accent2) !important; }

/* Drag handle */
.drag-handle {
  width: 26px; display: flex; align-items: center; justify-content: center;
  color: var(--border2); cursor: grab; flex-shrink: 0;
  font-size: 11px; background: var(--bg3);
  border-right: 1px solid var(--border);
  user-select: none;
  transition: color .12s;
}
.drag-handle:hover { color: var(--text3); }
.drag-handle:active { cursor: grabbing; }

/* Checkbox area */
.field-check-wrap { display: flex; align-items: center; padding: 0 9px; flex-shrink: 0; }
.field-check { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }

/* Label area */
.field-label-area {
  padding: 7px 6px 7px 0;
  min-width: 108px; max-width: 108px;
  display: flex; flex-direction: column; justify-content: center; flex-shrink: 0;
}
.field-name { font-size: 12px; font-weight: 500; color: var(--text); line-height: 1.3; }
.field-tag {
  font-size: 9px; font-family: 'JetBrains Mono', monospace;
  background: var(--bg3); padding: 1px 4px; border-radius: 3px;
  color: var(--text3); margin-top: 3px; display: inline-block;
}
.field-custom-tag {
  font-size: 9px; font-family: 'JetBrains Mono', monospace;
  background: #f0e8ff; padding: 1px 4px; border-radius: 3px;
  color: #7b5ea7; margin-top: 3px; display: inline-block;
}

/* Config area (right side of row) */
.field-config-area {
  flex: 1; padding: 6px 8px;
  display: flex; flex-direction: column; gap: 4px;
  border-left: 1px solid var(--border);
  min-width: 0;
}
.field-config-area.collapsed { display: none; }
.field-config-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

/* Selects & inputs */
.field-type-select {
  padding: 2px 5px; border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--bg); color: var(--text);
  font-size: 11px; font-family: inherit; cursor: pointer;
}
.field-type-select:focus { outline: none; border-color: var(--accent2); }
.field-input {
  padding: 3px 7px; border-radius: 4px;
  border: 1px solid var(--border2);
  background: var(--bg); color: var(--text);
  font-size: 11px; font-family: inherit; width: 100%;
}
.field-input:focus { outline: none; border-color: var(--accent2); }

/* Options editor */
.options-editor { display: flex; flex-direction: column; gap: 3px; }
.option-row { display: flex; align-items: center; gap: 3px; }
.option-row input {
  flex: 1; padding: 2px 6px;
  border: 1px solid var(--border2); border-radius: 3px;
  background: var(--bg); font-size: 11px;
  font-family: inherit; color: var(--text);
}
.option-row input:focus { outline: none; border-color: var(--accent2); }
.opt-del-btn { border: none; background: none; cursor: pointer; color: var(--text3); font-size: 13px; padding: 0 2px; line-height: 1; }
.opt-del-btn:hover { color: var(--accent); }
.add-option-btn { font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 1px 0; text-align: left; }
.add-option-btn:hover { text-decoration: underline; }
.def-sel-label { font-size: 10px; color: var(--text3); flex-shrink: 0; white-space: nowrap; }

/* Delete button */
.field-del-btn {
  display: flex; align-items: center; justify-content: center;
  width: 28px; flex-shrink: 0;
  background: none; border: none; border-left: 1px solid var(--border);
  color: var(--text3); cursor: pointer; font-size: 13px;
  transition: color .12s, background .12s;
}
.field-del-btn:hover { color: var(--accent); background: var(--accent-pale); }

/* Add custom field button */
.add-field-btn {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 7px;
  border: 1.5px dashed var(--border2); background: none;
  color: var(--text3); font-size: 12px; font-family: inherit;
  cursor: pointer; transition: all .12s; width: 100%; margin-top: 6px;
}
.add-field-btn:hover { border-color: var(--accent2); color: var(--accent); background: var(--accent-pale); }

/* New field name input inline */
.new-field-row {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px; border-radius: 7px;
  border: 1.5px solid var(--accent2); background: var(--accent-pale);
  margin-top: 5px;
}
.new-field-row input {
  flex: 1; padding: 4px 8px; border-radius: 4px;
  border: 1px solid var(--accent2); background: var(--bg);
  font-size: 12px; font-family: inherit; color: var(--text);
}
.new-field-row input:focus { outline: none; }
.new-field-confirm {
  padding: 4px 10px; border-radius: 4px;
  background: var(--accent); color: #fff; border: none;
  font-size: 12px; font-family: inherit; cursor: pointer;
  white-space: nowrap;
}
.new-field-confirm:hover { background: #b8425a; }
.new-field-cancel {
  padding: 4px 8px; border-radius: 4px;
  background: none; color: var(--text3); border: 1px solid var(--border2);
  font-size: 12px; font-family: inherit; cursor: pointer;
}
.new-field-cancel:hover { background: var(--bg3); }

/* Node context menu */
.ctx-menu {
  position: fixed;
  background: var(--bg);
  border: 1.5px solid var(--border);
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,.15);
  z-index: 900;
  min-width: 160px;
  overflow: hidden;
  display: none;
}
.ctx-menu.open { display: block; }
.ctx-item {
  padding: 9px 14px;
  font-size: 12.5px;
  cursor: pointer;
  display: flex; align-items: center; gap: 8px;
  color: var(--text2);
  transition: background .1s;
}
.ctx-item:hover { background: var(--bg3); color: var(--text); }
.ctx-item svg { flex-shrink: 0; }

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Splitter */
.splitter {
  width: 5px;
  background: var(--border);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background .15s;
}
.splitter:hover { background: var(--accent2); }

/* Toast */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--text);
  color: var(--bg);
  padding: 9px 18px;
  border-radius: 6px;
  font-size: 13px;
  opacity: 0;
  transition: all .25s;
  z-index: 2000;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Resize handle */
.resize-indicator {
  position: absolute; top: 0; right: 0; bottom: 0;
  width: 3px;
  cursor: col-resize;
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <div class="toolbar-title">文档<span>框架</span>编辑器</div>
  <div class="tb-sep"></div>
  <button class="tb-btn" onclick="loadExample()">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h5v2H4v8h8v-3h2v5H2V2z"/><path d="M9 2h5v5h-2V5.41L7.41 10 6 8.59 10.59 4H9V2z"/></svg>

function getContrastText(hex) {
  const {r, g, b} = hexToRgb(hex);
  const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return luminance > 0.72 ? '#2d2420' : '#ffffff';
}

function makePaletteSeries(mains) {
  return mains.map(main => ({
    l1: main,
    l2: mixHexColor(main, '#ffffff', 0.34),
    l3: mixHexColor(main, '#ffffff', 0.78),

let activeThemeKey = 'default';

function hexToRgb(hex) {
  const clean = String(hex).replace('#', '');
  const full = clean.length === 3 ? clean.split('').map(ch => ch + ch).join('') : clean;
  const num = parseInt(full, 16);
  return {r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255};
}

function rgbToHex({r, g, b}) {
  return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
}

function mixHexColor(a, b, ratio) {
  const ca = hexToRgb(a);
  const cb = hexToRgb(b);
  return rgbToHex({
    r: ca.r * (1 - ratio) + cb.r * ratio,
    g: ca.g * (1 - ratio) + cb.g * ratio,
    b: ca.b * (1 - ratio) + cb.b * ratio,
  });
}

function buildThemePalettes(theme) {
  if (theme.palettes) return theme.palettes;
  const bases = theme.bases || ['#c9536a', '#82b0d8', '#72bda8', '#e0ae72'];
  const accents = ['#5c4030', '#2a6f84', '#6a5b9a', '#6b8e3e', '#a86430'];
  return Array.from({length: 15}, (_, idx) => {
    const base = bases[idx % bases.length];
    const accent = accents[idx % accents.length];
    return {
      l1: mixHexColor(base, accent, 0.42),
      l2: mixHexColor(base, accent, 0.16),
      l3: mixHexColor(base, '#ffffff', 0.58),
      text: '#fff',
    };
  });
}

function getActivePalettes() {
  return buildThemePalettes(MAP_THEMES[activeThemeKey] || MAP_THEMES.default);
}

  const theme = MAP_THEMES[activeThemeKey] || MAP_THEMES.default;

  root.setProperty('--bg2', chrome.bg2);
  root.setProperty('--bg3', chrome.bg3);
  root.setProperty('--border', chrome.border);
  root.setProperty('--border2', chrome.border2);
  root.setProperty('--accent', chrome.accent);
  root.setProperty('--accent2', chrome.accent2);
  root.setProperty('--accent-pale', chrome.pale);
}

// ══════════════════════════════════════════════
//  MARKDOWN PARSER
//  每个 heading 节点额外携带 body 数组:
//    [{type:'text'|'image'|'note', content:string, src?:string, alt?:string}]
//  body 来自该标题到下一同级/更高级标题之间的普通段落和图片行
// ══════════════════════════════════════════════
function parseMd(text) {
  const lines = text.split('\n');
  const nodes = [];
  const mapNotes = [];
  let idCounter = 0;
  const stack = [];

  // 先标注每行类型
  const parsed = lines.map((raw, lineIndex) => {
    const line = raw.trim();
    const hm = line.match(/^(#{1,6})\s+(.+)/);
    if (hm) return {type:'heading', level: hm[1].length, text: hm[2].trim()};
    const nm = line.match(/^>\s*\[!NOTE\]\s*(.*?)(?:\s*<!--\s*map-note:x=(-?\d+(?:\.\d+)?),y=(-?\d+(?:\.\d+)?)\s*-->)?$/i);
    if (nm) {
      const content = (nm[1] || 'Note').trim() || 'Note';
      const note = {
        type: 'note',
        content,
        lineIndex,
        x: nm[2] !== undefined ? Number(nm[2]) : null,
        y: nm[3] !== undefined ? Number(nm[3]) : null,
      };
      if (note.x !== null && note.y !== null) mapNotes.push(note);
      return note;
    }
    const im = line.match(/^!\[([^\]]*)\]\(([^)]+)\)/);
    if (im) return {type:'image', alt: im[1], src: im[2]};
    if (line) return {type:'text', text: line};
    return {type:'empty'};
  });

  // 找所有 heading 的位置
  const headingIdxs = [];
  parsed.forEach((p, i) => { if (p.type === 'heading') headingIdxs.push(i); });

  headingIdxs.forEach((hi, pos) => {
    const p = parsed[hi];
    let title = p.text;
    let isTask = false;
    if (/\[task\]/i.test(title)) {
      isTask = true;
      title = title.replace(/\[task\]/gi, '').trim();
    }
    const level = p.level;
    const id = idCounter++;

    while (stack.length && stack[stack.length-1].level >= level) stack.pop();
    const parentId = stack.length ? stack[stack.length-1].id : null;
    stack.push({level, id});

    // 收集正文：到下一个 heading 为止
    const nextHi = headingIdxs[pos + 1] ?? parsed.length;
    const body = [];
    for (let i = hi + 1; i < nextHi; i++) {
      const bp = parsed[i];
      if (bp.type === 'note' && bp.x === null) body.push({type:'note', content: bp.content});
      if (bp.type === 'text')  body.push({type:'text',  content: bp.text});
      if (bp.type === 'image') body.push({type:'image', src: bp.src, alt: bp.alt || ''});
    }

    nodes.push({
      id, parentId, level, title, isTask, body,
      lineStart: hi,
      bodyLineStart: hi + 1,
      bodyLineEnd: nextHi - 1,
      collapsed: level <= 2 ? false : true,
    });
  });
  parseMd.lastNotes = mapNotes;
  return nodes;
}

let imageAssetStore = {};

function loadImageAssets() {
  try {
    imageAssetStore = JSON.parse(localStorage.getItem('docFramework_assets') || '{}') || {};
  } catch {
    imageAssetStore = {};
  }
}

function saveImageAssets() {
  localStorage.setItem('docFramework_assets', JSON.stringify(imageAssetStore));
}

function createImageAssetRef() {
  return `asset:img_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
}

function resolveImageSrc(src) {
  if (typeof src === 'string' && src.startsWith('asset:')) {
    return imageAssetStore[src] || '';
  }
  return src;
}

function migrateInlineImageData(mdText) {
  let changed = false;
  const migrated = String(mdText).replace(/!\[([^\]]*)\]\((data:image\/[^)]+)\)/g, (_, alt, dataUrl) => {
    const assetRef = createImageAssetRef();
    imageAssetStore[assetRef] = dataUrl;
    changed = true;
    return `![${alt}](${assetRef})`;
  });
  if (changed) saveImageAssets();
  return {text: migrated, changed};
}

  let cur = node;
  let anchor = node.level === 2 ? node : null;
  while (cur) {
    if (cur.level === 2) anchor = cur;
    if (cur.parentId === null || cur.parentId === undefined) {
      const root = cur;
      const rootIndex = mapState.tree ? mapState.tree.roots.findIndex(r => r.id === root.id) : 0;
      if (!anchor || anchor.id === root.id) return Math.max(0, rootIndex);
      const siblings = root.children || Object.values(nodeMap).filter(n => n.parentId === root.id);
      const idx = siblings.findIndex(n => n.id === anchor.id);
      return Math.max(0, rootIndex * 2 + (idx >= 0 ? idx : 0));
    }
    cur = nodeMap[cur.parentId];
  }
  return 0;
}

function getNodeColor(nodeMap, node) {
  if (node.level === 1) return {bg:'#1a1a2e', border:'#1a1a2e', color:'#faf7f2'};
  const palettes = getActivePalettes();
  const pi = getPaletteIdx(nodeMap, node) % palettes.length;
  const pal = palettes[pi];
  const shade = node.level === 2 ? 'l1' : node.level === 3 ? 'l2' : 'l3';
  const textColor = node.level === 2 ? (pal.text || '#fff') : '#2d2420';
  return {bg: pal[shade], border: pal.l1, color: textColor};
}

// body node gets a very light tint of its heading's palette
function getBodyColor(nodeMap, headingNode) {
  if (headingNode.level === 1) return {bg:'#2a2a4a', border:'#3a3a5a', color:'#d0d0e8'};
  const palettes = getActivePalettes();
  const pi = getPaletteIdx(nodeMap, headingNode) % palettes.length;
  const pal = palettes[pi];
  return {bg: pal.l3, border: pal.l2, color:'#2d2420'};
}

function buildTree(nodes) {
  const map = {};
  nodes.forEach(n => { map[n.id] = {...n, children: []}; });
  const roots = [];
  nodes.forEach(n => {
    if (n.parentId === null) roots.push(map[n.id]);
    else if (map[n.parentId]) map[n.parentId].children.push(map[n.id]);
  });
  return {roots, map};
}

// Total height of a heading node's body block (if body visible)
function bodyBlockH(node) {
  if (!node.body || node.body.length === 0) return 0;
  return BODY_BOX_PAD_Y * 2 + node.body.reduce((sum, b, i) => {
    return sum + bodyItemHeight(b) + (i > 0 ? BODY_CONTENT_GAP : 0);
  }, 0);
}

function noteLines(text = '') {
  return wrapTextByWidth(text, NOTE_W - NOTE_PAD_X * 2, 11);
}

function noteHeight(text = '') {
  return NOTE_PAD_Y * 2 + noteLines(text).length * NOTE_LINE_H;
}

function isPresentationBodyVisible(node) {
  if (!presentState.active || !node.body || node.body.length === 0) return false;
  const current = presentState.order[presentState.index];
  return !!current && current.id === node.id;
}

function hasVisibleBody(node) {
  if (!node.body || node.body.length === 0) return false;
  return isPresentationBodyVisible(node) || !!node.bodyExpanded;
}

function bodyRendersAbove(node) {
  return hasVisibleBody(node) && mapState.layoutMode === 'fishbone' && (node._fishSide === -1 || node.parentId === null);
}

function bodyRendersBelow(node) {
  return hasVisibleBody(node) && !bodyRendersAbove(node);
}

function nodeBodySpan(node) {
  return hasVisibleBody(node) ? BODY_STACK_GAP + bodyBlockH(node) : 0;
}

function nodeOwnH(node) {
  return nodeHeadingH(node) + nodeBodySpan(node);
}

function nodeUpperH(node) {
  return bodyRendersAbove(node) ? nodeBodySpan(node) : 0;
}

function nodeLowerH(node) {
  return nodeHeadingH(node) + (bodyRendersBelow(node) ? nodeBodySpan(node) : 0);
}

function childrenBlockH(node) {
  if (node.collapsed || node.children.length === 0) return 0;
  return node.children.reduce((sum, child) => sum + subtreeH(child) + V_GAP, -V_GAP);
}

function textVisualWidth(text = '', fontSize = 12) {
  return String(text).split('').reduce((sum, ch) => {
    if (ch === ' ') return sum + fontSize * 0.32;
    if (/[\u3000-\u9fff\uff00-\uffef]/.test(ch)) return sum + fontSize * 1.04;
    if (/[A-Z0-9]/.test(ch)) return sum + fontSize * 0.68;
    return sum + fontSize * 0.56;
  }, 0);
}

function wrapTextByWidth(text = '', maxWidth = 180, fontSize = 11) {
  const out = [];
  String(text).split('\n').forEach(part => {
    let line = '';
    for (const ch of String(part)) {
      const next = line + ch;
      if (line && textVisualWidth(next, fontSize) > maxWidth) {
        out.push(line);
        line = ch;
      } else {
        line = next;
      }
    }
    out.push(line || '');
  });
  return out.length ? out : [''];
}

function nodeTitleMaxWidth(node) {
  let titleMaxW = NODE_W - NODE_TEXT_PAD_X - NODE_TEXT_RIGHT_PAD;
  if (node.children && node.children.length > 0) titleMaxW -= 18;
  if (node.body && node.body.length > 0) titleMaxW -= 18;
  if (node.isTask) titleMaxW -= 46;
  return Math.max(64, titleMaxW);
}

function getNodeTitleLines(node) {
  const maxW = nodeTitleMaxWidth(node);
  return wrapTextByWidth(node.title, maxW, 12);
}

function nodeHeadingH(node) {
  return Math.max(NODE_H, NODE_TITLE_PAD_Y * 2 + getNodeTitleLines(node).length * NODE_TITLE_LINE_H);
}

function getBodyTextLines(text = '') {
  return wrapTextByWidth(text, BODY_W - BODY_BOX_PAD_X * 2, 11).length;
}

// Subtree height including body
function subtreeH(node) {
  const upper = nodeUpperH(node);
  const lower = nodeLowerH(node);
  const childH = childrenBlockH(node);
  if (childH <= 0) return upper + lower;
  if (bodyRendersBelow(node)) return upper + lower + V_GAP + childH;
  return upper + Math.max(lower, childH);
}

function layoutTree(root, x, y) {
  root.x = x;
  const upper = nodeUpperH(root);
  const lower = nodeLowerH(root);
  const childH = childrenBlockH(root);
  if (bodyRendersBelow(root)) root.y = y + upper;
  else root.y = y + upper + Math.max(0, (childH - lower) / 2);

  if (root.collapsed || root.children.length === 0) return;

  const childX = x + NODE_W + H_GAP;
  let curY = bodyRendersBelow(root)
    ? (root.y + lower + V_GAP)
    : (y + upper + Math.max(0, (lower - childH) / 2));
  for (const child of root.children) {
    const h = subtreeH(child);
    layoutTree(child, childX, curY);
    curY += h + V_GAP;
  }
}

function bodyItemHeight(item) {
  if (item.type === 'image') return BODY_IMG_BTN_H;
  if (item.type === 'note') return noteHeight(item.content);
  return Math.max(BODY_H, getBodyTextLines(item.content) * BODY_TEXT_LINE_H + BODY_TEXT_PAD_Y * 2);
}

function getVisibleNodes(node, acc=[]) {
  acc.push(node);
  if (!node.collapsed) node.children.forEach(child => getVisibleNodes(child, acc));
  return acc;
}

function setFishSide(node, side) {
  node._fishSide = side;
  node.children.forEach(child => setFishSide(child, side));
}

function getBodyAnchor(node) {
  const bodyH = bodyBlockH(node);
  if (mapState.layoutMode === 'fishbone' && (node._fishSide === -1 || node.parentId === null)) {
    return {
      x: node.x + BODY_INDENT,
      y: node.y - BODY_STACK_GAP - bodyH,
    };
  }
  return {
    x: node.x + BODY_INDENT,
    y: node.y + nodeHeadingH(node) + BODY_STACK_GAP,
  };
}

function getNodeBounds(node) {
  let minX = node.x;
  let minY = node.y;
  let maxX = node.x + NODE_W;
  let maxY = node.y + nodeHeadingH(node);

  if (hasVisibleBody(node)) {
    const anchor = getBodyAnchor(node);
    minY = Math.min(minY, anchor.y);
    maxX = Math.max(maxX, anchor.x + BODY_W);
    maxY = Math.max(maxY, anchor.y + bodyBlockH(node));
  }

  return {minX, minY, maxX, maxY};
}

function getSubtreeBounds(node) {
  const bounds = {minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity};
  for (const item of getVisibleNodes(node, [])) {
    const box = getNodeBounds(item);
    bounds.minX = Math.min(bounds.minX, box.minX);
    bounds.minY = Math.min(bounds.minY, box.minY);
    bounds.maxX = Math.max(bounds.maxX, box.maxX);
    bounds.maxY = Math.max(bounds.maxY, box.maxY);
  }
  return bounds;
}

function translateSubtree(node, dx, dy) {
  node.x += dx;
  node.y += dy;
  if (node._fish) {
    node._fish.spineY += dy;
    node._fish.sectionBottom += dy;
  }
  node.children.forEach(child => translateSubtree(child, dx, dy));
}

function getVisibleBounds(roots) {
  const bounds = {minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity};
  roots.forEach(root => {
    getVisibleNodes(root, []).forEach(node => {
      const box = getNodeBounds(node);
      bounds.minX = Math.min(bounds.minX, box.minX);
      bounds.minY = Math.min(bounds.minY, box.minY);
      bounds.maxX = Math.max(bounds.maxX, box.maxX);
      bounds.maxY = Math.max(bounds.maxY, box.maxY);
    });
    if (root._fish) {
      bounds.maxX = Math.max(bounds.maxX, root._fish.spineEnd);
      bounds.minY = Math.min(bounds.minY, root._fish.spineY);
      bounds.maxY = Math.max(bounds.maxY, root._fish.sectionBottom);
    }
  });
  return bounds;
}

function normalizeLayout(roots) {
  const bounds = getVisibleBounds(roots);
  if (!Number.isFinite(bounds.minX) || !Number.isFinite(bounds.minY)) return;
  const dx = bounds.minX < MAP_PAD ? MAP_PAD - bounds.minX : 0;
  const dy = bounds.minY < MAP_PAD ? MAP_PAD - bounds.minY : 0;
  if (dx === 0 && dy === 0) return;
  roots.forEach(root => translateSubtree(root, dx, dy));
}

function svgEl(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (v !== undefined && v !== null) el.setAttribute(k, String(v));
  });
  return el;
}

function truncateSvgText(text = '', maxChars = NODE_TEXT_MAX_CHARS) {
  const str = String(text);
  if (str.length <= maxChars) return str;
  return str.slice(0, Math.max(1, maxChars - 1)) + '…';
}

function truncateSvgTextByWidth(text = '', maxWidth = 160, fontSize = 12) {
  const str = String(text);
  if (textVisualWidth(str, fontSize) <= maxWidth) return str;
  let out = '';
  for (const ch of str) {
    if (textVisualWidth(out + ch + '…', fontSize) > maxWidth) break;
    out += ch;
  }
  return (out || str.slice(0, 1)) + '…';
}

function wrapSvgText(text = '', maxChars = BODY_TEXT_WRAP_CHARS) {
  const lines = [];
  String(text).split('\n').forEach(part => {
    const chunk = part || '';
    if (!chunk) {
      lines.push('');
      return;
    }
    for (let i = 0; i < chunk.length; i += maxChars) {
      lines.push(chunk.slice(i, i + maxChars));
    }
  });
  return lines.length ? lines : [''];
}

function addSvgText(group, x, y, text, opts = {}) {
  const t = svgEl('text', {
    x,
    y,
    fill: opts.fill || '#000',
    'font-size': opts.fontSize || 12,
    'font-family': `'Noto Sans SC', sans-serif`,
    'font-weight': opts.fontWeight || 400,
    'dominant-baseline': opts.baseline || 'middle',
    'text-anchor': opts.anchor || 'start',
    'pointer-events': opts.pointerEvents || 'none',
  });
  t.textContent = text;
  group.appendChild(t);
  return t;
}

function renderNoteStrip(parent, x, y, text, opts = {}) {
  const width = opts.width || NOTE_W;
  const lines = wrapTextByWidth(text, width - NOTE_PAD_X * 2, 11);
  const height = NOTE_PAD_Y * 2 + lines.length * NOTE_LINE_H;
  const g = svgEl('g', {transform: `translate(${x},${y})`, class: opts.className || 'note-strip'});
  g.appendChild(svgEl('rect', {
    x: 0, y: 0, width, height, rx: 4, ry: 4,
    fill: opts.fill || '#fff2a8',
    stroke: opts.stroke || '#d7b84f',
    'stroke-width': opts.strokeWidth || 1.4,
  }));
  g.appendChild(svgEl('rect', {
    x: 0, y: 0, width: 5, height, rx: 3, ry: 3,
    fill: opts.accent || '#f0b429',
  }));
  lines.forEach((line, li) => {
    addSvgText(g, NOTE_PAD_X + 4, NOTE_PAD_Y + li * NOTE_LINE_H, line, {
      fill: opts.color || '#5b4a13',
      fontSize: 11,
      fontWeight: 500,
      baseline: 'hanging',
    });
  });
  parent.appendChild(g);
  return {group: g, width, height};
}

function layoutMindmapRoots(roots) {
  let startY = 0;
  roots.forEach(root => {
    layoutTree(root, 0, startY);
    startY += subtreeH(root) + ROOT_GAP;
  });
}

function layoutFishboneRoots(roots) {
  let sectionY = 0;

  roots.forEach(root => {
    const spineY = sectionY + FISH_ROOT_TOP_PAD;
    root.x = 0;
    root.y = spineY - nodeHeadingH(root) / 2;
    root._fish = {spineY, spineEnd: root.x + NODE_W + 160};
    const rootBounds = getNodeBounds(root);

    if (!root.collapsed && root.children.length > 0) {
      const cursorX = {top: root.x + NODE_W + 96, bottom: root.x + NODE_W + 96};
      let branchMaxX = rootBounds.maxX;
      let branchMaxY = rootBounds.maxY;

      root.children.forEach((child, index) => {
        const side = index % 2 === 0 ? 'top' : 'bottom';
        const sideDir = side === 'top' ? -1 : 1;
        setFishSide(child, sideDir);
        layoutTree(child, 0, 0);

        const branchBounds = getSubtreeBounds(child);
        const dx = cursorX[side] - branchBounds.minX;
        const dy = side === 'top'
          ? (spineY - FISH_SPINE_MARGIN - branchBounds.maxY)
          : (spineY + FISH_SPINE_MARGIN - branchBounds.minY);

        translateSubtree(child, dx, dy);

        const placedBounds = getSubtreeBounds(child);
        branchMaxX = Math.max(branchMaxX, placedBounds.maxX);
        branchMaxY = Math.max(branchMaxY, placedBounds.maxY);
        cursorX[side] = placedBounds.maxX + FISH_BRANCH_GAP;
      });

      root._fish.spineEnd = Math.max(cursorX.top, cursorX.bottom, branchMaxX + 48);
      root._fish.sectionBottom = branchMaxY + 48;
      sectionY = root._fish.sectionBottom + FISH_SECTION_GAP;
    } else {
      root._fish.sectionBottom = rootBounds.maxY + 80;
      sectionY = root._fish.sectionBottom + FISH_SECTION_GAP;
    }
  });
}

// ══════════════════════════════════════════════
//  RENDERER
// ══════════════════════════════════════════════
let mapState = { nodes: [], tree: null, notes: [], scale: 1, tx: 40, ty: 40, canvasW: 1, canvasH: 1, layoutMode: 'mindmap', selectedNodeId: null };
let ctxTarget = null;
let ctxMode = 'node';
let ctxPoint = {clientX: 0, clientY: 0};
let presentState = {active: false, order: [], index: 0, savedCollapse: null};

function getLineOffset(lines, lineIndex) {
  let offset = 0;
  for (let i = 0; i < Math.max(0, lineIndex); i++) offset += lines[i].length + 1;
  return offset;
}

function focusMarkdownNode(node, preferBody = false) {
  const editor = document.getElementById('md-editor');
  if (!editor || !node) return;
  const lines = editor.value.split('\n');
  let targetLine = Number.isInteger(node.lineStart) ? node.lineStart : 0;
  if (preferBody && Number.isInteger(node.bodyLineStart) && node.bodyLineStart <= node.bodyLineEnd) {
    targetLine = node.bodyLineStart;
    for (let i = node.bodyLineStart; i <= node.bodyLineEnd && i < lines.length; i++) {
      if (String(lines[i]).trim()) {
        targetLine = i;
        break;
      }
    }
  }
  const offset = getLineOffset(lines, targetLine);
  editor.focus();
  editor.setSelectionRange(offset, offset);
  const lineHeight = parseFloat(getComputedStyle(editor).lineHeight) || 24;
  editor.scrollTop = Math.max(0, targetLine * lineHeight - editor.clientHeight * 0.35);
}

function selectMapNode(node, preferBody = false) {
  if (!node) return;
  mapState.selectedNodeId = node.id;
  focusMarkdownNode(node, preferBody);
  drawMap();
}

function collectPreorder(node, acc = []) {
  acc.push(node);
  node.children.forEach(child => collectPreorder(child, acc));
  return acc;
}

function buildPresentationOrder() {
  if (!mapState.tree) return [];
  const order = [];
  mapState.tree.roots.forEach(root => collectPreorder(root, order));
  return order;
}

function updatePresentationStatus() {
  const status = document.getElementById('presentationStatus');
  const startBtn = document.getElementById('presentationStartBtn');
  if (status) {
    status.textContent = presentState.active && presentState.order.length
      ? `${presentState.index + 1}/${presentState.order.length}`
      : '';
  }
  if (startBtn) startBtn.classList.toggle('active', presentState.active);
}

function getPresentationVisual(node) {
  if (!presentState.active) return {revealed: true, current: false, opacity: 1};
  const pos = presentState.order.findIndex(item => item.id === node.id);
  if (pos < 0) return {revealed: true, current: false, opacity: 1};
  const revealed = pos <= presentState.index;
  return {
    revealed,
    current: pos === presentState.index,
    opacity: revealed ? (pos === presentState.index ? 1 : 0.72) : 0.08,
  };
}

function focusPresentationNode() {
  if (!presentState.active || !presentState.order.length || !mapState.tree) return;
  const current = mapState.tree.map[presentState.order[presentState.index].id];
  if (!current) return;
  const canvas = document.getElementById('map-canvas');
  const box = getNodeBounds(current);
  const boxW = Math.max(1, box.maxX - box.minX);
  const boxH = Math.max(1, box.maxY - box.minY);
  const fitScale = Math.min(1.7, Math.max(0.75, Math.min(canvas.clientWidth / (boxW + 220), canvas.clientHeight / (boxH + 180))));
  mapState.scale = fitScale;
  mapState.tx = (box.minX + box.maxX) / 2 - canvas.clientWidth / (2 * fitScale);
  mapState.ty = (box.minY + box.maxY) / 2 - canvas.clientHeight / (2 * fitScale);
  updateTransform();
}

function startPresentation() {
  const text = document.getElementById('md-editor').value;
  if (!mapState.tree && text.trim()) renderMap();
  if (!mapState.tree) { showToast('请先生成架构图'); return; }
  presentState.savedCollapse = {};
  Object.values(mapState.tree.map).forEach(node => {
    presentState.savedCollapse[node.id] = node.collapsed;
    node.collapsed = false;
  });
  presentState.order = buildPresentationOrder();
  presentState.index = 0;
  presentState.active = presentState.order.length > 0;
  mapState.selectedNodeId = presentState.order[0] ? presentState.order[0].id : null;
  drawMap();
  updatePresentationStatus();
  focusPresentationNode();
}

function stopPresentation(restore = false) {
  if (!presentState.active && !presentState.savedCollapse) return;
  if (restore && presentState.savedCollapse && mapState.tree) {
    Object.values(mapState.tree.map).forEach(node => {
      if (Object.prototype.hasOwnProperty.call(presentState.savedCollapse, node.id)) {
        node.collapsed = presentState.savedCollapse[node.id];
      }
    });
  }
  presentState = {active: false, order: [], index: 0, savedCollapse: null};
  drawMap();
  updatePresentationStatus();
}

function nextPresentation() {
  if (!presentState.active) { startPresentation(); return; }
  if (presentState.index < presentState.order.length - 1) {
    presentState.index += 1;
    mapState.selectedNodeId = presentState.order[presentState.index].id;
    drawMap();
    updatePresentationStatus();
    focusPresentationNode();
  } else {
    showToast('演示已到最后一页');
  }
}

function prevPresentation() {
  if (!presentState.active) return;
  presentState.index = Math.max(0, presentState.index - 1);
  mapState.selectedNodeId = presentState.order[presentState.index].id;
  drawMap();
  updatePresentationStatus();
  focusPresentationNode();
}

function renderMap() {
  const text = document.getElementById('md-editor').value;
  const flat = parseMd(text);
  mapState.notes = parseMd.lastNotes || [];
  if (flat.length === 0) { showToast('请先输入 Markdown 内容'); return; }

  // Preserve collapse states across re-renders
  const prevMap = {};
  if (mapState.tree) Object.values(mapState.tree.map).forEach(n => {
    prevMap[n.title + ':' + n.level] = {collapsed: n.collapsed, bodyExpanded: n.bodyExpanded};
  });

  flat.forEach(n => {
    const key = n.title + ':' + n.level;
    if (prevMap[key]) {
      n.collapsed    = prevMap[key].collapsed;
      n.bodyExpanded = prevMap[key].bodyExpanded ?? false;
    } else {
      n.collapsed    = n.level > 2;
      n.bodyExpanded = false;
    }
  });

  mapState.nodes = flat;
  const {roots, map} = buildTree(flat);
  mapState.tree = {roots, map};
  drawMap();
  resetView();
}

function drawMap() {
  const layer = document.getElementById('map-layer');
  layer.innerHTML = '';

  const {roots, map} = mapState.tree;

  // Layout
  if (mapState.layoutMode === 'fishbone') layoutFishboneRoots(roots);
  else layoutMindmapRoots(roots);
  normalizeLayout(roots);

  const visible = [];
  roots.forEach(root => getVisibleNodes(root, visible));

  // ── Draw connectors ──
  const connG = document.createElementNS('http://www.w3.org/2000/svg','g');
  if (mapState.layoutMode === 'fishbone') {
    roots.forEach(root => {
      if (root.collapsed || root.children.length === 0) return;
      const spine = document.createElementNS('http://www.w3.org/2000/svg','line');
      spine.setAttribute('x1', root.x + NODE_W);
      spine.setAttribute('y1', root._fish.spineY);
      spine.setAttribute('x2', root._fish.spineEnd);
      spine.setAttribute('y2', root._fish.spineY);
      spine.setAttribute('stroke', getNodeColor(map, root).border);
      spine.setAttribute('stroke-width', '2');
      spine.setAttribute('opacity', '0.38');
      connG.appendChild(spine);
    });
  }
  for (const node of visible) {
    if (node.parentId === null || node.parentId === undefined) continue;
    const parent = map[node.parentId];
    if (!parent) continue;
    const nodeVisual = getPresentationVisual(node);

    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    const {border} = node.isTask ? {border: TASK_BORDER} : getNodeColor(map, node);
    if (mapState.layoutMode === 'fishbone' && parent.level === 1) {
      const joinX = node.x - 26;
      const y2 = node.y + nodeHeadingH(node) / 2;
      path.setAttribute('d', `M${joinX},${parent._fish.spineY} L${node.x},${y2}`);
    } else {
      const x1 = parent.x + NODE_W;
      const y1 = parent.y + nodeHeadingH(parent) / 2;
      const x2 = node.x;
      const y2 = node.y + nodeHeadingH(node) / 2;
      const cx = (x1 + x2) / 2;
      path.setAttribute('d', `M${x1},${y1} C${cx},${y1} ${cx},${y2} ${x2},${y2}`);
    }
    path.setAttribute('stroke', border);
    path.setAttribute('stroke-width', '1.5');
    path.setAttribute('fill', 'none');
    path.setAttribute('opacity', presentState.active ? (nodeVisual.revealed ? '0.42' : '0.06') : '0.5');
    connG.appendChild(path);
  }
  layer.appendChild(connG);

  // ── Draw heading nodes ──
  let maxX = 0, maxY = 0;

  for (const node of visible) {
    const presentVisual = getPresentationVisual(node);
    const isSelected = mapState.selectedNodeId === node.id;
    const headingH = nodeHeadingH(node);
    const titleLines = getNodeTitleLines(node);
    const colors = node.isTask
      ? {bg: TASK_BG, border: TASK_BORDER, color: TASK_TEXT}
      : getNodeColor(map, node);

    const g = svgEl('g', {transform: `translate(${node.x},${node.y})`, class: 'node-svg'});
    g.setAttribute('opacity', presentVisual.opacity);
    if (!presentVisual.revealed) g.style.pointerEvents = 'none';
    const rect = svgEl('rect', {
      x: 0, y: 0, rx: 6, ry: 6,
      width: NODE_W, height: headingH,
      fill: colors.bg,
      stroke: presentVisual.current ? '#d94b4b' : (isSelected ? '#ff7f50' : colors.border),
      'stroke-width': presentVisual.current ? 3 : (isSelected ? 2.4 : 1.5),
    });
    if (presentVisual.current) {
      rect.setAttribute('filter', 'drop-shadow(0 4px 10px rgba(217,75,75,.28))');
    }
    rect.style.cursor = 'pointer';
    g.appendChild(rect);

    const titleGroup = svgEl('g', {});
    const titleStartY = (headingH - titleLines.length * NODE_TITLE_LINE_H) / 2 + NODE_TITLE_LINE_H / 2;
    titleLines.forEach((line, li) => {
      addSvgText(titleGroup, NODE_TEXT_PAD_X, titleStartY + li * NODE_TITLE_LINE_H, line, {
        fill: colors.color,
        fontSize: 12,
        fontWeight: 500,
      });
    });
    titleGroup.style.cursor = 'text';
    titleGroup.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const val = window.prompt('编辑标题', node.title);
      if (val !== null) {
        const trimmed = val.trim();
        if (trimmed && trimmed !== node.title) {
          node.title = trimmed;
          syncNodeTitleToMd(node);
          drawMap();
        }
      }
    });
    g.appendChild(titleGroup);

    if (node.isTask) {
      const badgeW = 28;
      const badgeX = NODE_W - 66;
      g.appendChild(svgEl('rect', {
        x: badgeX, y: 8, width: badgeW, height: 16, rx: 4, ry: 4,
        fill: 'rgba(255,255,255,.45)',
        stroke: 'rgba(0,0,0,.08)',
        'stroke-width': 1,
      }));
      addSvgText(g, badgeX + badgeW / 2, 16, 'task', {
        fill: TASK_TEXT,
        fontSize: 9,
        fontWeight: 500,
        anchor: 'middle',
      });
    }

    let ctlX = NODE_W - 18;
    if (node.children.length > 0) {
      const tog = svgEl('g', {transform: `translate(${ctlX},${Math.max(10, headingH / 2 - 7)})`, class: 'node-ctl'});
      const togBg = svgEl('circle', {
        cx: 7, cy: 7, r: 7,
        fill: 'rgba(255,255,255,.68)',
        stroke: 'rgba(0,0,0,.15)',
        'stroke-width': 1,
      });
      tog.appendChild(togBg);
      addSvgText(tog, 7, 7.5, node.collapsed ? '+' : '−', {
        fill: colors.color,
        fontSize: 9,
        fontWeight: 700,
        anchor: 'middle',
      });
      tog.style.cursor = 'pointer';
      tog.addEventListener('click', (e) => {
        e.stopPropagation();
        node.collapsed = !node.collapsed;
        drawMap();
      });
      g.appendChild(tog);
      ctlX -= 18;
    }

    if (node.body && node.body.length > 0) {
      const bodyCtl = svgEl('g', {transform: `translate(${ctlX - 1},${Math.max(7, headingH / 2 - 10)})`, class: 'node-ctl'});
      bodyCtl.appendChild(svgEl('line', {
        x1: 8, y1: 11, x2: 8, y2: 18,
        stroke: '#d94b4b',
        'stroke-width': 2,
        'stroke-linecap': 'round',
      }));
      bodyCtl.appendChild(svgEl('circle', {
        cx: 8, cy: 7, r: 7,
        fill: '#d94b4b',
        stroke: '#b63232',
        'stroke-width': 1,
      }));
      addSvgText(bodyCtl, 8, 7.5, node.bodyExpanded ? '−' : '+', {
        fill: '#fff',
        fontSize: 10,
        fontWeight: 700,
        anchor: 'middle',
      });
      bodyCtl.style.cursor = 'pointer';
      bodyCtl.addEventListener('click', (e) => {
        e.stopPropagation();
        node.bodyExpanded = !node.bodyExpanded;
        drawMap();
      });
      g.appendChild(bodyCtl);
    }

    g.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      ctxTarget = node;
      ctxMode = 'node';
      ctxPoint = {clientX: e.clientX, clientY: e.clientY};
      showCtx(e.clientX, e.clientY);
    });
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectMapNode(node, false);
    });
    layer.appendChild(g);

    maxX = Math.max(maxX, node.x + NODE_W + 60);
    maxY = Math.max(maxY, node.y + headingH + 60);

    // -- Body node (rendered below heading as one box) --
    if (hasVisibleBody(node) && presentVisual.revealed) {
      const anchor = getBodyAnchor(node);
      const bodyX = anchor.x;
      const bodyY = anchor.y;
      const bodyH = bodyBlockH(node);
      const bColors = getBodyColor(map, node);
      const bodyAbove = mapState.layoutMode === 'fishbone' && (node._fishSide === -1 || node.parentId === null);

      // connector from heading to body box
      const bc = document.createElementNS('http://www.w3.org/2000/svg','line');
      bc.setAttribute('x1', node.x + NODE_W / 2);
      bc.setAttribute('y1', bodyAbove ? node.y : node.y + headingH);
      bc.setAttribute('x2', bodyX + BODY_W / 2);
      bc.setAttribute('y2', bodyAbove ? bodyY + bodyH : bodyY);
      bc.setAttribute('stroke', bColors.border);
      bc.setAttribute('stroke-width', '1');
      bc.setAttribute('stroke-dasharray', '4 3');
      bc.setAttribute('opacity', '0.6');
      layer.appendChild(bc);

      const bodyGroup = svgEl('g', {transform: `translate(${bodyX},${bodyY})`, class: 'body-svg'});
      if (isSelected) bodyGroup.setAttribute('opacity', '1');
      bodyGroup.appendChild(svgEl('rect', {
        x: 0, y: 0, width: BODY_W, height: bodyH, rx: 6, ry: 6,
        fill: bColors.bg,
        stroke: isSelected ? '#ff7f50' : bColors.border,
        'stroke-width': isSelected ? 2.2 : 1.5,
      }));

      let contentY = BODY_BOX_PAD_Y;

      node.body.forEach((bItem, bi) => {
        if (bItem.type === 'image') {
          const btn = svgEl('g', {transform: `translate(${BODY_BOX_PAD_X},${contentY})`});
          btn.appendChild(svgEl('rect', {
            x: 0, y: 0, width: BODY_W - BODY_BOX_PAD_X * 2, height: BODY_IMG_BTN_H, rx: 5, ry: 5,
            fill: 'rgba(255,255,255,.5)',
            stroke: bColors.border,
            'stroke-width': 1,
          }));
          addSvgText(btn, 10, BODY_IMG_BTN_H / 2, truncateSvgTextByWidth(bItem.alt || `图片 ${bi + 1}`, BODY_W - BODY_BOX_PAD_X * 2 - 58, 11), {
            fill: bColors.color,
            fontSize: 11,
          });
          addSvgText(btn, BODY_W - BODY_BOX_PAD_X * 2 - 10, BODY_IMG_BTN_H / 2, '放大', {
            fill: bColors.color,
            fontSize: 11,
            fontWeight: 600,
            anchor: 'end',
          });
          btn.style.cursor = 'pointer';
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            openLightbox(resolveImageSrc(bItem.src), bItem.alt);
          });
          bodyGroup.appendChild(btn);
          contentY += BODY_IMG_BTN_H;
        } else if (bItem.type === 'note') {
          const note = renderNoteStrip(bodyGroup, BODY_BOX_PAD_X, contentY, bItem.content, {
            width: BODY_W - BODY_BOX_PAD_X * 2,
            className: 'body-note-strip',
          });
          note.group.style.cursor = 'text';
          note.group.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            const val = window.prompt('编辑 Note', bItem.content);
            if (val !== null && val.trim() !== bItem.content) {
              bItem.content = val.trim() || 'Note';
              syncBodyToMd(node);
              drawMap();
            }
          });
          contentY += note.height;
        } else {
          const lines = wrapTextByWidth(bItem.content, BODY_W - BODY_BOX_PAD_X * 2, 11);
          const textG = svgEl('g', {transform: `translate(${BODY_BOX_PAD_X},${contentY})`});
          lines.forEach((line, li) => {
            addSvgText(textG, 0, BODY_TEXT_PAD_Y + li * BODY_TEXT_LINE_H, line, {
              fill: bColors.color,
              fontSize: 11,
              baseline: 'hanging',
            });
          });
          textG.style.cursor = 'text';
          textG.addEventListener('dblclick', (e) => {
            e.stopPropagation();
            const val = window.prompt('编辑正文', bItem.content);
            if (val !== null && val !== bItem.content) {
              bItem.content = val;
              syncBodyToMd(node);
              drawMap();
            }
          });
          bodyGroup.appendChild(textG);
          contentY += bodyItemHeight(bItem);
        }
        if (bi < node.body.length - 1) contentY += BODY_CONTENT_GAP;
      });
      bodyGroup.addEventListener('click', (e) => {
        e.stopPropagation();
        selectMapNode(node, true);
      });
      bodyGroup.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        e.stopPropagation();
        ctxTarget = node;
        ctxMode = 'node';
        ctxPoint = {clientX: e.clientX, clientY: e.clientY};
        showCtx(e.clientX, e.clientY);
      });
      layer.appendChild(bodyGroup);

      maxX = Math.max(maxX, bodyX + BODY_W + 60);
      maxY = Math.max(maxY, bodyY + bodyH + 60);
    }
  }

  (mapState.notes || []).forEach((note) => {
    const x = Number.isFinite(note.x) ? note.x : MAP_PAD;
    const y = Number.isFinite(note.y) ? note.y : MAP_PAD;
    const rendered = renderNoteStrip(layer, x, y, note.content, {className: 'map-note-strip'});
    rendered.group.style.cursor = 'text';
    rendered.group.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const val = window.prompt('编辑 Note', note.content);
      if (val !== null && val.trim() !== note.content) {
        note.content = val.trim() || 'Note';
        syncMapNoteToMd(note);
        renderMap();
      }
    });
    rendered.group.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      e.stopPropagation();
      ctxTarget = null;
      ctxMode = 'canvas';
      ctxPoint = {clientX: e.clientX, clientY: e.clientY};
      showCtx(e.clientX, e.clientY);
    });
    maxX = Math.max(maxX, x + rendered.width + 60);
    maxY = Math.max(maxY, y + rendered.height + 60);
  });

  if (mapState.layoutMode === 'fishbone') {
    roots.forEach(root => {
      if (!root._fish) return;
      maxX = Math.max(maxX, root._fish.spineEnd + 40);
      maxY = Math.max(maxY, root._fish.sectionBottom + 20);
    });
  }

  document.getElementById('map-svg').setAttribute('width',  maxX);
  document.getElementById('map-svg').setAttribute('height', maxY);
}

// ── Inline edit: heading title ──
function startInlineEdit(lbl, node, field, colors) {
  const input = document.createElement('input');
  input.value = node.title;
  input.style.cssText = `
    width:100%;border:none;outline:none;background:transparent;
    color:${colors.color};font-size:12px;font-family:'Noto Sans SC',sans-serif;
  `;
  lbl.replaceWith(input);
  input.focus(); input.select();

  function commit() {
    const val = input.value.trim();
    if (val && val !== node.title) {
      node.title = val;
      syncNodeTitleToMd(node);
    }
    drawMap();
  }
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') { drawMap(); }
  });
}

// ── Inline edit: body text item ──
function startBodyInlineEdit(span, node, bodyIdx, colors) {
  const item = node.body[bodyIdx];
  const input = document.createElement('input');
  input.value = item.content;
  input.style.cssText = `
    flex:1;border:none;outline:none;background:transparent;
    color:${colors.color};font-size:11px;font-family:'Noto Sans SC',sans-serif;width:100%;
  `;
  span.replaceWith(input);
  input.focus(); input.select();

  function commit() {
    const val = input.value.trim();

      syncBodyToMd(node);

  input.addEventListener('blur', commit);

  });
}

// ── Sync heading title back to Markdown ──
// Strategy: find the N-th occurrence of headings at this level (by node.id order)
function syncNodeTitleToMd(node) {
  const editor = document.getElementById('md-editor');
  const lines = editor.value.split('\n');
  const prefix = '#'.repeat(node.level) + ' ';
  const headingLineIdx = Number.isInteger(node.lineStart) ? node.lineStart : -1;
  if (headingLineIdx < 0 || headingLineIdx >= lines.length) return;
  const raw = lines[headingLineIdx].replace(/^#{1,6}\s+/, '');
  const hasTask = /\[task\]/i.test(raw);
  lines[headingLineIdx] = prefix + node.title + (hasTask ? ' [task]' : '');
  editor.value = lines.join('\n');
  localStorage.setItem('docFramework_md', editor.value);
}

function normalizeNoteText(value) {
  return String(value || '')
    .replace(/\s*\n+\s*/g, ' ')
    .replace(/\s{2,}/g, ' ')
    .trim() || 'Note';
}

function noteMarkdownLine(content, x = null, y = null) {
  const note = `> [!NOTE] ${normalizeNoteText(content)}`;
  if (Number.isFinite(x) && Number.isFinite(y)) {
    return `${note} <!-- map-note:x=${x.toFixed(1)},y=${y.toFixed(1)} -->`;
  }
  return note;
}

// ── Sync body text back to Markdown ──
function syncBodyToMd(node) {
  const editor = document.getElementById('md-editor');
  const lines = editor.value.split('\n');
  const headingLineIdx = Number.isInteger(node.lineStart) ? node.lineStart : -1;
  if (headingLineIdx < 0) return;

  // Find end of body (next heading of any level)
  let bodyEnd = lines.length;
  for (let i = headingLineIdx + 1; i < lines.length; i++) {
    if (/^#{1,6}\s/.test(lines[i])) { bodyEnd = i; break; }
  }

  // Build new body lines
  const newBodyLines = node.body.map(b => {
    if (b.type === 'image') return `![${b.alt}](${b.src})`;
    if (b.type === 'note') return noteMarkdownLine(b.content);
    return b.content;
  });

  lines.splice(
    headingLineIdx + 1,
    bodyEnd - headingLineIdx - 1,
    ...(newBodyLines.length > 0 ? ['', ...newBodyLines, ''] : [])
  );

  editor.value = lines.join('\n');
  localStorage.setItem('docFramework_md', editor.value);
}

function syncMapNoteToMd(note) {
  const editor = document.getElementById('md-editor');
  const lines = editor.value.split('\n');
  const lineIndex = Number.isInteger(note.lineIndex) ? note.lineIndex : -1;
  if (lineIndex < 0 || lineIndex >= lines.length) return;
  lines[lineIndex] = noteMarkdownLine(note.content, note.x, note.y);
  editor.value = lines.join('\n');
  localStorage.setItem('docFramework_md', editor.value);
}

// ── Lightbox for image preview ──
function openLightbox(src, alt) {
  const resolvedSrc = resolveImageSrc(src);
  if (!resolvedSrc) {
    showToast('图片数据不存在，可能已被清理');
    return;
  }
  let lb = document.getElementById('lightbox');
  if (!lb) {
    lb = document.createElement('div');
    lb.id = 'lightbox';
    lb.style.cssText = `
      position:fixed;inset:0;background:rgba(0,0,0,.75);
      z-index:3000;display:flex;align-items:center;justify-content:center;
      cursor:zoom-out;
    `;
    document.body.appendChild(lb);
  }
  lb.innerHTML = '';
  const img = document.createElement('img');
  img.src = resolvedSrc;
  img.alt = alt || '';
  img.style.cssText = 'max-width:88vw;max-height:88vh;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.5);';
  lb.appendChild(img);
  lb.style.display = 'flex';
  lb.onclick = () => { lb.style.display = 'none'; };
}

function updateTransform() {
  const canvas = document.getElementById('map-canvas');
  const svg = document.getElementById('map-svg');
  const w = Math.max(1, canvas.clientWidth);
  const h = Math.max(1, canvas.clientHeight);
  mapState.canvasW = w;
  mapState.canvasH = h;
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
  svg.style.transform = 'none';
  svg.setAttribute('viewBox', `${mapState.tx} ${mapState.ty} ${w / mapState.scale} ${h / mapState.scale}`);
}

function setScaleAt(nextScale, screenX, screenY) {
  const scale = Math.min(2.5, Math.max(0.2, nextScale));
  const worldX = mapState.tx + screenX / mapState.scale;
  const worldY = mapState.ty + screenY / mapState.scale;
  mapState.scale = scale;
  mapState.tx = worldX - screenX / scale;
  mapState.ty = worldY - screenY / scale;
  updateTransform();
}

function resetView() {
  mapState.scale = 1;
  mapState.tx = 0;
  mapState.ty = 0;
  updateTransform();
}

function zoomIn() {
  const canvas = document.getElementById('map-canvas');
  setScaleAt(mapState.scale * 1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
}
function zoomOut() {
  const canvas = document.getElementById('map-canvas');
  setScaleAt(mapState.scale / 1.2, canvas.clientWidth / 2, canvas.clientHeight / 2);
}

function exportMapPng() {
  if (!mapState.tree) {
    const text = document.getElementById('md-editor').value;
    if (!text.trim()) {
      showToast('请先输入 Markdown 内容');
      return;
    }
    renderMap();
  }

  const svg = document.getElementById('map-svg');
  const exportW = Math.max(1, Math.ceil(parseFloat(svg.getAttribute('width')) || 1));
  const exportH = Math.max(1, Math.ceil(parseFloat(svg.getAttribute('height')) || 1));
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
  clone.setAttribute('width', String(exportW));
  clone.setAttribute('height', String(exportH));
  clone.setAttribute('viewBox', `0 0 ${exportW} ${exportH}`);
  clone.style.width = exportW + 'px';
  clone.style.height = exportH + 'px';

  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', '0');
  bg.setAttribute('y', '0');
  bg.setAttribute('width', String(exportW));
  bg.setAttribute('height', String(exportH));
  bg.setAttribute('fill', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim() || '#ffffff');
  clone.insertBefore(bg, clone.firstChild);

  const source = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([source], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();

  img.onload = () => {
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = exportW * scale;
    canvas.height = exportH * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      if (!blob) {
        showToast('导出 PNG 失败');
        return;
      }
      const pngUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = pngUrl;
      a.download = '文档架构图.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(pngUrl), 1200);
      showToast('已导出 文档架构图.png ✓');
    }, 'image/png');
  };

  img.onerror = () => {
    URL.revokeObjectURL(url);
    showToast('导出 PNG 失败');
  };
  img.src = url;
}

function updateLayoutSwitch() {
  document.querySelectorAll('#mapLayoutSwitch .map-layout-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.layout === mapState.layoutMode);
  });
}

function setMapLayout(mode) {
  if (mode !== 'mindmap' && mode !== 'fishbone') return;
  mapState.layoutMode = mode;
  localStorage.setItem('docFramework_layout', mode);
  updateLayoutSwitch();
  if (mapState.tree) {
    drawMap();
    resetView();
  } else {
    const text = document.getElementById('md-editor')?.value || '';
    if (text.trim()) renderMap();
  }
}

function expandAll() {
  if (!mapState.tree) return;
  Object.values(mapState.tree.map).forEach(n => {
    n.collapsed = false;
    if (n.body && n.body.length > 0) n.bodyExpanded = true;
  });
  drawMap();
}

function collapseToL2() {
  if (!mapState.tree) return;
  Object.values(mapState.tree.map).forEach(n => {
    n.collapsed = n.level > 2;
    if (n.body && n.body.length > 0) n.bodyExpanded = false;
  });
  drawMap();
}

// ══════════════════════════════════════════════
//  PAN & ZOOM
// ══════════════════════════════════════════════
let drag = {active: false, startX: 0, startY: 0, startTx: 0, startTy: 0};

document.getElementById('map-canvas').addEventListener('mousedown', (e) => {
  if (e.button !== 0) return;
  if (e.target.closest && e.target.closest('.node-svg, .body-svg, .node-ctl, .note-strip, .body-note-strip, .map-note-strip, #mapLayoutSwitch')) return;
  drag.active = true;
  drag.startX = e.clientX;
  drag.startY = e.clientY;
  drag.startTx = mapState.tx;
  drag.startTy = mapState.ty;
});
document.addEventListener('mousemove', (e) => {
  if (!drag.active) return;
  mapState.tx = drag.startTx - (e.clientX - drag.startX) / mapState.scale;
  mapState.ty = drag.startTy - (e.clientY - drag.startY) / mapState.scale;
  updateTransform();
});
document.addEventListener('mouseup', () => { drag.active = false; });

document.getElementById('map-canvas').addEventListener('wheel', (e) => {
  e.preventDefault();
  const canvas = document.getElementById('map-canvas');
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const factor = e.deltaY > 0 ? 0.9 : 1.1;
  setScaleAt(mapState.scale * factor, mouseX, mouseY);
}, {passive: false});

document.getElementById('map-canvas').addEventListener('contextmenu', (e) => {
  if (e.target.closest && e.target.closest('.node-svg, .body-svg, .node-ctl, .note-strip, .body-note-strip, .map-note-strip, #mapLayoutSwitch')) return;
  e.preventDefault();
  ctxTarget = null;
  ctxMode = 'canvas';
  ctxPoint = {clientX: e.clientX, clientY: e.clientY};
  showCtx(e.clientX, e.clientY);
});

document.addEventListener('keydown', (e) => {
  if (!presentState.active) return;
  const tag = document.activeElement && document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT' || tag === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === ' ') {
    e.preventDefault();
    nextPresentation();
  } else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    prevPresentation();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    stopPresentation(true);
  }
});

function toggleNodeType() {
  if (!ctxTarget) return;
  ctxTarget.isTask = !ctxTarget.isTask;
  // Sync back to markdown
  syncTypeToMd(ctxTarget);
  drawMap();
  hideCtx();
}

function toggleCollapse() {
  if (!ctxTarget || ctxTarget.children.length === 0) return;
  ctxTarget.collapsed = !ctxTarget.collapsed;
  drawMap();
  hideCtx();
}

function addNoteFromContext() {
  const editor = document.getElementById('md-editor');
  const text = window.prompt('Add Note', 'Note');
  if (text === null) {
    hideCtx();
    return;
  }
  const noteText = normalizeNoteText(text);
  const lines = editor.value.split('\n');

  if (ctxMode === 'node' && ctxTarget && Number.isInteger(ctxTarget.lineStart)) {
    let insertAt = ctxTarget.lineStart + 1;
    for (let i = ctxTarget.lineStart + 1; i < lines.length; i++) {
      if (/^#{1,6}\s+/.test(lines[i])) {
        insertAt = i;
        break;
      }
      insertAt = i + 1;
    }
    const insertLines = [];
    if (insertAt > 0 && lines[insertAt - 1].trim()) insertLines.push('');
    insertLines.push(noteMarkdownLine(noteText));
    if (insertAt < lines.length && lines[insertAt].trim()) insertLines.push('');
    lines.splice(insertAt, 0, ...insertLines);
  } else {
    const canvas = document.getElementById('map-canvas');
    const rect = canvas.getBoundingClientRect();
    const localX = (ctxPoint.clientX || rect.left + MAP_PAD) - rect.left;
    const localY = (ctxPoint.clientY || rect.top + MAP_PAD) - rect.top;
    const worldX = mapState.tx + localX / mapState.scale;
    const worldY = mapState.ty + localY / mapState.scale;
    if (editor.value.trim()) lines.push('');
    lines.push(noteMarkdownLine(noteText, worldX, worldY));
  }

  editor.value = lines.join('\n').replace(/\n{4,}/g, '\n\n\n');
  localStorage.setItem('docFramework_md', editor.value);
  hideCtx();
  renderMap();
  if (ctxMode === 'node' && ctxTarget && mapState.tree && mapState.tree.map[ctxTarget.id]) {
    mapState.tree.map[ctxTarget.id].bodyExpanded = true;
    drawMap();
  }
}

function syncTypeToMd(node) {
  const editor = document.getElementById('md-editor');
  const lines = editor.value.split('\n');
  const headingLineIdx = Number.isInteger(node.lineStart) ? node.lineStart : -1;
  if (headingLineIdx < 0 || headingLineIdx >= lines.length) return;
  if (node.isTask && !/\[task\]/i.test(lines[headingLineIdx])) {
    lines[headingLineIdx] = lines[headingLineIdx].trimEnd() + ' [task]';
  } else if (!node.isTask) {
    lines[headingLineIdx] = lines[headingLineIdx].replace(/\[task\]/gi, '').trimEnd();
  }
  editor.value = lines.join('\n');
  localStorage.setItem('docFramework_md', editor.value);
}
