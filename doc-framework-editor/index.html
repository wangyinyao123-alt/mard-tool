// Runtime state — persisted across modal opens within session
let fieldState = [];
let customKeyCounter = 0;

function initFieldState() {
  // Only init once per session; preserve state across re-opens
  if (fieldState.length === 0) {
    fieldState = ALL_FIELDS.map(f => ({
      ...f,
      isCustom: false,
      enabled: f.defaultOn,
      currentType: f.valueType,
      value: f.defaultVal || '',
      options: f.options ? [...f.options] : [],
    }));
  }
}

function openExportModal() {
  initFieldState();
  renderExportModal();
  document.getElementById('exportModal').classList.add('open');
}
function closeExportModal() {
  document.getElementById('exportModal').classList.remove('open');
}

// ── DRAG STATE ──
let dragSrc = null;

function renderExportModal() {
  // ── Preset chips ──
  const chipsEl = document.getElementById('presetChips');
  chipsEl.innerHTML = '';
  PRESETS.forEach(p => {
    const fs = fieldState.find(f => f.key === p.key);
    if (!fs) return;
    const chip = document.createElement('div');
    chip.className = 'preset-chip' + (fs.enabled ? ' active' : '');
    chip.textContent = p.label;
    chip.addEventListener('click', () => { fs.enabled = !fs.enabled; renderExportModal(); });
    chipsEl.appendChild(chip);
  });

  // ── Field grid ──
  const grid = document.getElementById('fieldGrid');
  grid.innerHTML = '';

  fieldState.forEach((fs, idx) => {
    const row = buildFieldRow(fs, idx);
    grid.appendChild(row);
  });

  // ── Add custom field button ──
  const addBtn = document.createElement('button');
  addBtn.className = 'add-field-btn';
  addBtn.innerHTML = `<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 4a.5.5 0 0 1 .5.5v3h3a.5.5 0 0 1 0 1h-3v3a.5.5 0 0 1-1 0v-3h-3a.5.5 0 0 1 0-1h3v-3A.5.5 0 0 1 8 4z"/></svg> 添加自定义字段`;
  addBtn.addEventListener('click', () => addCustomField(grid));
  grid.appendChild(addBtn);
}

function buildFieldRow(fs, idx) {
  const row = document.createElement('div');
  row.className = 'field-row';
  row.style.cssText = 'display:flex;align-items:stretch;border-radius:7px;border:1.5px solid var(--border);background:var(--bg2);overflow:hidden;margin-bottom:0;';
  row.draggable = true;

  // ── Drag handle ──
  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.title = '拖拽排序';
  handle.innerHTML = '⠿';
  row.appendChild(handle);

  // ── Checkbox ──
  const cbWrap = document.createElement('div');
  cbWrap.className = 'field-check-wrap';
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.className = 'field-check'; cb.checked = fs.enabled;
  cb.addEventListener('change', () => { fs.enabled = cb.checked; renderExportModal(); });
  cbWrap.appendChild(cb);
  row.appendChild(cbWrap);

  // ── Label area ──
  const labelArea = document.createElement('div');
  labelArea.className = 'field-label-area';
  const nameEl = document.createElement('div');
  nameEl.className = 'field-name';
  nameEl.textContent = fs.label;
  labelArea.appendChild(nameEl);
  const tagEl = document.createElement('span');
  tagEl.className = fs.isCustom ? 'field-custom-tag' : 'field-tag';
  tagEl.textContent = fs.isCustom ? '自定义' : (fs.tag || fs.label);
  labelArea.appendChild(tagEl);
  row.appendChild(labelArea);

  // ── Config area ──
  const configArea = document.createElement('div');
  configArea.className = 'field-config-area' + (fs.enabled ? '' : ' collapsed');

  // Type selector row
  const cfgRow1 = document.createElement('div');
  cfgRow1.className = 'field-config-row';
  const typeLabel = document.createElement('span');
  typeLabel.style.cssText = 'font-size:10px;color:var(--text3);white-space:nowrap;';
  typeLabel.textContent = '值类型：';
  cfgRow1.appendChild(typeLabel);
  const typeSel = document.createElement('select');
  typeSel.className = 'field-type-select';
  [['input','手动输入'],['options','选项列表']].forEach(([v,l]) => {
    const o = document.createElement('option');
    o.value = v; o.textContent = l;
    if (v === fs.currentType) o.selected = true;
    typeSel.appendChild(o);
  });
  typeSel.addEventListener('change', () => { fs.currentType = typeSel.value; renderExportModal(); });
  cfgRow1.appendChild(typeSel);
  configArea.appendChild(cfgRow1);

  if (fs.currentType === 'input') {
    // Single default value input
    const cfgRow2 = document.createElement('div');
    cfgRow2.className = 'field-config-row';
    const inp = document.createElement('input');
    inp.className = 'field-input';
    inp.placeholder = '默认值（留空则导出时置空）';
    inp.value = fs.value;
    inp.addEventListener('input', () => { fs.value = inp.value; });
    cfgRow2.appendChild(inp);
    configArea.appendChild(cfgRow2);
  } else {
    // Options list editor
    const oe = document.createElement('div');
    oe.className = 'options-editor';
    fs.options.forEach((opt, oi) => {
      const or = document.createElement('div');
      or.className = 'option-row';
      const oinp = document.createElement('input');
      oinp.placeholder = `选项 ${oi + 1}`;
      oinp.value = opt;
      oinp.addEventListener('input', () => { fs.options[oi] = oinp.value; });
      const odl = document.createElement('button');
      odl.className = 'opt-del-btn'; odl.textContent = '×';
      odl.addEventListener('click', () => { fs.options.splice(oi, 1); renderExportModal(); });
      or.appendChild(oinp); or.appendChild(odl);
      oe.appendChild(or);
    });
    const addOptBtn = document.createElement('button');
    addOptBtn.className = 'add-option-btn'; addOptBtn.textContent = '+ 添加选项';
    addOptBtn.addEventListener('click', () => { fs.options.push(''); renderExportModal(); });
    oe.appendChild(addOptBtn);

    // Default value selector
    if (fs.options.filter(o => o).length > 0) {
      const defRow = document.createElement('div');
      defRow.className = 'field-config-row';
      defRow.style.marginTop = '2px';
      const defLabel = document.createElement('span');
      defLabel.className = 'def-sel-label'; defLabel.textContent = '默认值：';
      defRow.appendChild(defLabel);
      const defSel = document.createElement('select');
      defSel.className = 'field-type-select'; defSel.style.flex = '1';
      const emptyOpt = document.createElement('option');
      emptyOpt.value = ''; emptyOpt.textContent = '— 留空 —';
      defSel.appendChild(emptyOpt);
      fs.options.filter(o => o).forEach(o => {
        const op = document.createElement('option');
        op.value = o; op.textContent = o;
        if (o === fs.value) op.selected = true;
        defSel.appendChild(op);
      });
      defSel.addEventListener('change', () => { fs.value = defSel.value; });
      defRow.appendChild(defSel);
      oe.appendChild(defRow);
    }
    configArea.appendChild(oe);
  }
  row.appendChild(configArea);

  // ── Delete button (custom fields only) ──
  if (fs.isCustom) {
    const delBtn = document.createElement('button');
    delBtn.className = 'field-del-btn'; delBtn.title = '删除此字段'; delBtn.textContent = '✕';
    delBtn.addEventListener('click', () => {
      fieldState.splice(fieldState.indexOf(fs), 1);
      renderExportModal();
    });
    row.appendChild(delBtn);
  }

  // ── Drag & drop ──
  row.addEventListener('dragstart', (e) => {
    dragSrc = idx;
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(() => row.classList.add('dragging'), 0);
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.field-row').forEach(r => r.classList.remove('drag-over'));
  });
  row.addEventListener('dragover', (e) => {
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    row.classList.add('drag-over');
  });
  row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
  row.addEventListener('drop', (e) => {
    e.preventDefault();
    row.classList.remove('drag-over');
    if (dragSrc === null || dragSrc === idx) return;
    const moved = fieldState.splice(dragSrc, 1)[0];
    const targetIdx = dragSrc < idx ? idx - 1 : idx;
    fieldState.splice(targetIdx, 0, moved);
    dragSrc = null;
    renderExportModal();
  });

  return row;
}

function addCustomField(grid) {
  // Insert an inline form before the add button
  const existing = grid.querySelector('.new-field-row');
  if (existing) { existing.querySelector('input').focus(); return; }

  const newRow = document.createElement('div');
  newRow.className = 'new-field-row';

  const inp = document.createElement('input');
  inp.placeholder = '输入字段名称（如：英文责任人）';
  newRow.appendChild(inp);

  const confirmBtn = document.createElement('button');
  confirmBtn.className = 'new-field-confirm'; confirmBtn.textContent = '添加';
  confirmBtn.addEventListener('click', () => {
    const name = inp.value.trim();
    if (!name) { inp.focus(); return; }
    fieldState.push({
      key: 'custom_' + (++customKeyCounter),
      label: name, tag: name,
      isCustom: true,
      alwaysOn: false, defaultOn: true,
      enabled: true,
      currentType: 'input',
      valueType: 'input',
      value: '',
      options: [],
    });
    renderExportModal();
  });
  newRow.appendChild(confirmBtn);

  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'new-field-cancel'; cancelBtn.textContent = '取消';
  cancelBtn.addEventListener('click', () => newRow.remove());
  newRow.appendChild(cancelBtn);

  grid.insertBefore(newRow, grid.querySelector('.add-field-btn'));
  inp.focus();

  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') confirmBtn.click();
    if (e.key === 'Escape') cancelBtn.click();
  });
}

// ── 通用样式工厂 ──
function makeStyle(opts = {}) {
  const border = {
    top:    {style:'thin', color:{rgb:'CCCCCC'}},
    bottom: {style:'thin', color:{rgb:'CCCCCC'}},
    left:   {style:'thin', color:{rgb:'CCCCCC'}},
    right:  {style:'thin', color:{rgb:'CCCCCC'}},
  };
  return {
    font:      {name:'Arial', sz: opts.sz||10, bold:!!opts.bold, color:{rgb: opts.color||'333333'}},
    fill:      opts.bg ? {patternType:'solid', fgColor:{rgb: opts.bg}} : {patternType:'none'},
    alignment: {horizontal: opts.align||'left', vertical:'center', wrapText:!!opts.wrap},
    border,
  };
}

// 写单元格
function wc(ws, r, c, v, style) {
  const ref = XLSX.utils.encode_cell({r, c});
  ws[ref] = {v: v ?? '', t: typeof v === 'number' ? 'n' : 's', s: style};
}

// 设置合并单元格
function merge(ws, r1, c1, r2, c2) {
  if (!ws['!merges']) ws['!merges'] = [];
  ws['!merges'].push({s:{r:r1,c:c1}, e:{r:r2,c:c2}});
}

// 设置 ws 范围
function setRef(ws, maxR, maxC) {
  ws['!ref'] = XLSX.utils.encode_range({s:{r:0,c:0}, e:{r:maxR,c:maxC}});
}

// ── 颜色常量（对齐附件风格） ──
const C = {
  headerDark:  '2D2420',   // 深棕表头
  headerMid:   '5C4030',   // 中棕次级表头
  headerLight: 'E8DDD0',   // 浅米色区块标题
  noteRed:     'C0392B',   // 说明红字
  noteGray:    '888888',   // 示例灰字
  bodyBg:      'FAFAF8',   // 内容区底色
  altBg:       'F2EDE6',   // 交替行底色
  white:       'FFFFFF',
  black:       '000000',
};

// ══════════════════════════════════════════════
//  SHEET 1：内容策略
// ══════════════════════════════════════════════
function buildSheetContentStrategy() {
  const ws = {};
  let r = 0;

  const sTitle  = makeStyle({bold:true, sz:11, color:C.white,  bg:C.headerDark,  align:'center'});
  const sNote   = makeStyle({sz:9,  color:C.noteRed,  bg:C.headerLight});
  const sSecHd  = makeStyle({bold:true, sz:10, color:C.white,  bg:C.headerMid,  align:'left'});
  const sThHd   = makeStyle({bold:true, sz:10, color:C.white,  bg:C.headerDark, align:'center'});
  const sLabel  = makeStyle({bold:true, sz:10, color:'333333', bg:C.headerLight});
  const sVal    = makeStyle({sz:10, color:'333333', bg:C.bodyBg, wrap:true});
  const sValAlt = makeStyle({sz:10, color:'333333', bg:C.altBg,  wrap:true});
  const sStar   = makeStyle({bold:true, sz:10, color:C.noteRed, bg:C.headerLight});
  const sEmpty  = makeStyle({sz:10, bg:C.bodyBg});

  // 顶部说明行
  wc(ws, r, 0, '带*的为无条件必填项，不带的选填。红字为填写说明，灰字为填写示例。', sNote);
  merge(ws, r, 0, r, 7); r++;

  // ── 基本信息 ──
  wc(ws, r, 0, '基本信息*', sSecHd); merge(ws, r, 0, r, 7); r++;
  [
    ['产品名称*', ''],
    ['资料属性*', ''],
    ['需要的资料类型*', ''],
    ['资料受众分析*', ''],
  ].forEach(([lbl]) => {
    wc(ws, r, 0, lbl, sStar);
    wc(ws, r, 1, '', sVal); merge(ws, r, 1, r, 7); r++;
  });

  // 资料属性选项
  const attrOpts = ['标配', '中性'];
  attrOpts.forEach((o, i) => {
    wc(ws, r, 0, '', sEmpty);
    wc(ws, r, 1, o, i%2===0 ? sVal : sValAlt);
    merge(ws, r, 1, r, 7); r++;
  });

  // 资料类型选项
  const typeOpts = ['用户手册','软件安装指南','SDK开发指南（任何情况均仅提供中性版本）','算子开发指南（任何情况均仅提供中性版本）','硬件快速操作指南（含纸质说明书）'];
  typeOpts.forEach((o, i) => {
    wc(ws, r, 0, '', sEmpty);
    wc(ws, r, 1, o, i%2===0 ? sVal : sValAlt);
    merge(ws, r, 1, r, 7); r++;
  });

  // ── 受众分析表 ──
  wc(ws, r, 0, '资料受众分析*', sSecHd); merge(ws, r, 0, r, 7); r++;
  wc(ws, r, 0, '受众类型*', sThHd);
  wc(ws, r, 1, '资料需求*', sThHd); merge(ws, r, 1, r, 7); r++;
  const audiences = ['工业控制工程师','系统集成商','电气工程师','机械设备维修人员'];
  audiences.forEach((a, i) => {
    wc(ws, r, 0, a, i%2===0 ? sVal : sValAlt);
    wc(ws, r, 1, '', i%2===0 ? sVal : sValAlt); merge(ws, r, 1, r, 7); r++;
  });

  // ── 竞品分析 ──
  wc(ws, r, 0, '竞品资料分析（全新产品的文档或者改版优化文档必须填写）', sSecHd); merge(ws, r, 0, r, 7); r++;

// ══════════════════════════════════════════════
//  SHEET 3：用户手册开发框架
// ══════════════════════════════════════════════
function buildSheetFramework(nodes, enabledFields) {
  const ws = {};

  // 固定目录列
  const dirCols = ['Map','一级目录','二级目录','三级目录','四级目录','五级目录'];

  // 完整列头（对齐附件所有列，但只有 enabledFields 里的才填值）
  // 附件固定顺序：目录列 → 信息类型 → 更新类型 → 版本 → 聚合 → 章节要点 → 对应友商 →
  //              具体友商可借鉴内容 → 需提供的素材 → 素材提供方 → 素材提供进度 →
  //              素材具体位置 → 中文责任人 → 中文进度 → 中文完成日期 → 备注
  const FIXED_EXTRA_COLS = [
    {key:'infoType',    label:'信息类型'},
    {key:'updateType',  label:'更新类型'},
    {key:'version',     label:'版本'},
    {key:'aggregate',   label:'聚合'},
    {key:'keyPoints',   label:'章节要点'},
    {key:'competitor',  label:'对应友商'},
    {key:'compDetail',  label:'具体友商可借鉴内容'},
    {key:'materials',   label:'需提供的素材'},
    {key:'matSource',   label:'素材提供方'},
    {key:'matProgress', label:'素材提供进度'},
    {key:'matLocation', label:'素材具体位置'},
    {key:'owner',       label:'中文责任人'},
    {key:'progress',    label:'中文进度'},
    {key:'dueDate',     label:'中文完成日期'},
    {key:'remark',      label:'备注'},
  ];

  // 自定义字段附在最后
  const customFields = enabledFields.filter(f => f.isCustom);
  const allExtraCols = [...FIXED_EXTRA_COLS, ...customFields.map(f => ({key:f.key, label:f.label}))];
  const allHeaders   = [...dirCols, ...allExtraCols.map(c => c.label)];
  const totalCols    = allHeaders.length;

  // enabledFields map
  const enabledMap = {};
  enabledFields.forEach(f => { enabledMap[f.key] = f; });

  // 样式
  const sHdr = makeStyle({bold:true, sz:10, color:C.white, bg:C.headerDark, align:'center'});
  const sHdrDir = makeStyle({bold:true, sz:10, color:C.white, bg:C.headerDark, align:'center'});
  const sMap  = makeStyle({bold:true, sz:10, color:C.white, bg:'4A3728', align:'left'});
  const sEven = makeStyle({sz:10, color:'333333', bg:C.bodyBg, wrap:true});
  const sOdd  = makeStyle({sz:10, color:'333333', bg:C.altBg,  wrap:true});
  const sDirE = makeStyle({sz:10, color:'333333', bg:'EAE4DC'});
  const sDirO = makeStyle({sz:10, color:'333333', bg:'DDD5C8'});

  // 表头行
  allHeaders.forEach((h, ci) => wc(ws, 0, ci, h, ci < 6 ? sHdrDir : sHdr));

  // 数据行
  let dataRowIdx = 0;
  nodes.forEach((node) => {
    const r = dataRowIdx + 1;
    const isEven = dataRowIdx % 2 === 0;
    const sBody = isEven ? sEven : sOdd;
    const sDir  = isEven ? sDirE : sDirO;

    // 目录列：只在对应层级填标题
    dirCols.forEach((col, ci) => {
      const lvl = ci + 1;
      wc(ws, r, ci, node.level === lvl ? node.title : '', node.level === 1 ? sMap : sDir);
    });

    // 额外列
    allExtraCols.forEach((col, ei) => {
      const ci = 6 + ei;
      const fs = enabledMap[col.key];
      let val = '';
      if (fs) {
        if (col.key === 'infoType') {
          val = node.isTask
            ? (fs.options.find(o => /task/i.test(o)) || 'Task')
            : (fs.options.find(o => /concept/i.test(o)) || 'Concept');
        } else {
          val = fs.value || '';
        }
      }
      wc(ws, r, ci, val, node.level === 1 ? sMap : sBody);
    });

    dataRowIdx++;
  });

  // 列宽
  ws['!cols'] = allHeaders.map((h, i) => {
    if (i < 6) return {wch: 22};
    const baseW = Math.max(14, Math.min(30, h.length * 2.0));
    return {wch: baseW};
  });

  // 行高（表头高一点）
  const rowHeights = [{hpt:24}]; // 表头
  nodes.forEach(() => rowHeights.push({hpt:18}));
  ws['!rows'] = rowHeights;

  // 冻结首行
  ws['!freeze'] = {xSplit:0, ySplit:1, topLeftCell:'A2', activePane:'bottomLeft', state:'frozen'};

  setRef(ws, nodes.length, totalCols - 1);
  return ws;
}

// ══════════════════════════════════════════════
//  主导出函数
// ══════════════════════════════════════════════
function doExport() {
  const text = document.getElementById('md-editor').value;
  const nodes = parseMd(text);
  if (nodes.length === 0) { showToast('请先输入 Markdown 内容'); return; }

  const enabledFields = fieldState.filter(f => f.enabled);

  try {
    const wb = XLSX.utils.book_new();

    // Sheet 1 — 内容策略
    const ws1 = buildSheetContentStrategy();
    XLSX.utils.book_append_sheet(wb, ws1, '内容策略');

    // Sheet 2 — 复用策略
    const ws2 = buildSheetReuseStrategy();
    XLSX.utils.book_append_sheet(wb, ws2, '复用策略');

    // Sheet 3 — 用户手册开发框架
    const ws3 = buildSheetFramework(nodes, enabledFields);
    XLSX.utils.book_append_sheet(wb, ws3, '用户手册开发框架');

    XLSX.writeFile(wb, '文档框架.xlsx');
    closeExportModal();
    showToast('已导出 文档框架.xlsx（3个页签）✓');
  } catch(e) {
    console.error(e);
    showToast('导出失败：' + e.message);
  }
}

const REF_REUSE_WIDTHS = [13.075, 14.4583333333333, 12.9083333333333, 10.875, 5.25, 37.2416666666667, 9.60833333333333, 22.55, 17.25];
const EXCEL_FONT_NAME = '微软雅黑';
const EXCEL_BORDER = {
  top: {style: 'thin', color: {argb: 'FF000000'}},
  left: {style: 'thin', color: {argb: 'FF000000'}},
  bottom: {style: 'thin', color: {argb: 'FF000000'}},
  right: {style: 'thin', color: {argb: 'FF000000'}},
};

function excelArgb(rgb) {
  if (!rgb) return undefined;
  const clean = String(rgb).replace('#', '').toUpperCase();
  if (clean.length === 8) return clean;
  if (clean.length === 6) return 'FF' + clean;
  return undefined;
}

function excelColName(index) {
  let n = index;
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function setExcelCell(cell, value, style = {}) {
  cell.value = value === undefined ? '' : value;
  if (style.font) cell.font = style.font;
  if (style.fill) cell.fill = style.fill;
  if (style.alignment) cell.alignment = style.alignment;
  if (style.border) cell.border = style.border;
  if (style.numFmt) cell.numFmt = style.numFmt;
}

function styleRegion(ws, r1, c1, r2, c2, style, value) {
  for (let r = r1; r <= r2; r++) {
    for (let c = c1; c <= c2; c++) {
      setExcelCell(ws.getCell(r, c), '', style);
    }
  }
  if (r1 !== r2 || c1 !== c2) ws.mergeCells(r1, c1, r2, c2);
  if (value !== undefined) ws.getCell(r1, c1).value = value;
}

function legacyStyleToExcel(style = {}, sheetKind = 'generic') {
  const fill = style.fill && style.fill.fgColor ? excelArgb(style.fill.fgColor.rgb) : undefined;
  const fontColor = style.font && style.font.color ? excelArgb(style.font.color.rgb) : undefined;
  const out = {
    font: {
      name: EXCEL_FONT_NAME,
      sz: style.font && style.font.sz ? style.font.sz : 10,
      bold: !!(style.font && style.font.bold),
      italic: !!(style.font && style.font.italic),
      color: {argb: fontColor || 'FF000000'},
    },
    alignment: {
      horizontal: (style.alignment && style.alignment.horizontal) || 'left',
      vertical: 'middle',
      wrapText: !!(style.alignment && style.alignment.wrapText),
    },
    border: EXCEL_BORDER,
  };

  if (sheetKind !== 'framework') {
    if (fontColor === 'FFC0392B' || fontColor === 'FFC00000') {
      out.font.color = {argb: 'FFC00000'};
      out.fill = undefined;
      return out;
    }
    if (fill === 'FF2D2420' || fill === 'FF5C4030') {
      out.font = {name: EXCEL_FONT_NAME, sz: 11, bold: true, color: {argb: 'FF000000'}};
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF9DC3E6'}};
      return out;
    }
    if (fill === 'FFE8DDD0') {
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFF2F2F2'}};
      if (fontColor === 'FFC0392B') out.fill = undefined;
      return out;
    }
    if (fill === 'FFFAFAF8' || fill === 'FFF2EDE6') {
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFFFFFFF'}};
      return out;
    }
  }

  if (sheetKind === 'framework') {
    if (fill === 'FF2D2420') {
      out.font = {name: EXCEL_FONT_NAME, sz: 11, bold: true, color: {argb: 'FF000000'}};
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF9DC3E6'}};
      return out;
    }
    if (fill === 'FF4A3728') {
      out.font = {name: EXCEL_FONT_NAME, sz: 11, bold: false, color: {argb: 'FF000000'}};
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFDEEBF7'}};
      return out;
    }
    if (fill === 'FFEAE4DC' || fill === 'FFDDD5C8' || fill === 'FFFAFAF8' || fill === 'FFF2EDE6') {
      out.font = {name: EXCEL_FONT_NAME, sz: 11, bold: false, color: {argb: 'FF000000'}};
      out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FFFFFFFF'}};
      return out;
    }
  }

  if (fill) out.fill = {type: 'pattern', pattern: 'solid', fgColor: {argb: fill}};
  return out;
}

function copyLegacySheetToExcel(legacy, ws, kind, widths) {
  const range = XLSX.utils.decode_range(legacy['!ref']);
  for (let c = 0; c <= range.e.c; c++) {
    const width = widths && widths[c] ? widths[c] : (legacy['!cols'] && legacy['!cols'][c] && legacy['!cols'][c].wch) || 12;
    ws.getColumn(c + 1).width = width;
  }
  if (legacy['!rows']) {
    legacy['!rows'].forEach((row, idx) => {
      if (row && row.hpt) ws.getRow(idx + 1).height = row.hpt;
    });
  }

  for (let r = 0; r <= range.e.r; r++) {
    for (let c = 0; c <= range.e.c; c++) {
      const ref = XLSX.utils.encode_cell({r, c});
      const src = legacy[ref];
      if (!src) continue;
      const cell = ws.getCell(r + 1, c + 1);
      cell.value = src.v;
      const mapped = legacyStyleToExcel(src.s || {}, kind);
      setExcelCell(cell, src.v, mapped);
    }
  }

  (legacy['!merges'] || []).forEach(m => {
    ws.mergeCells(m.s.r + 1, m.s.c + 1, m.e.r + 1, m.e.c + 1);
  });
}

function frameworkHeaderStyle() {
  return {
    font: {name: EXCEL_FONT_NAME, sz: 11, bold: true, color: {argb: 'FF000000'}},
    fill: {type: 'pattern', pattern: 'solid', fgColor: {argb: 'FF9DC3E6'}},
    alignment: {horizontal: 'left', vertical: 'middle', wrapText: true},
    border: EXCEL_BORDER,
  };
}

function frameworkBodyStyle(isMapRow) {
  return {
    font: {name: EXCEL_FONT_NAME, sz: 11, color: {argb: 'FF000000'}},
    fill: {type: 'pattern', pattern: 'solid', fgColor: {argb: isMapRow ? 'FFDEEBF7' : 'FFFFFFFF'}},
    alignment: {horizontal: 'left', vertical: 'middle', wrapText: true},
    border: EXCEL_BORDER,
  };
}

function buildFrameworkOptionSheet(workbook, columns) {
  const optionColumns = columns.filter(col => col.fs && col.fs.currentType === 'options' && col.fs.options.filter(Boolean).length > 0);
  if (optionColumns.length === 0) return {};

  const ws = workbook.addWorksheet('选项配置');
  ws.state = 'veryHidden';
  const map = {};

  optionColumns.forEach((col, idx) => {
    const excelCol = idx + 1;
    const colLetter = excelColName(excelCol);
    const opts = col.fs.options.filter(Boolean);
    ws.getCell(1, excelCol).value = col.label;
    opts.forEach((opt, oi) => {
      ws.getCell(oi + 2, excelCol).value = opt;
    });
    ws.getColumn(excelCol).width = Math.max(10, Math.min(28, Math.max(...opts.map(o => String(o).length), String(col.label).length) + 2));
    map[col.key] = `'选项配置'!$${colLetter}$2:$${colLetter}$${opts.length + 1}`;
  });

  return map;
}

function getFrameworkFieldValue(node, rowIndex, col, fs) {
  if (!fs) return '';
  if (col.key === 'infoType') {
    if (node.parentId === null) return rowIndex === 0 ? 'Parent Map' : 'Child Map';
    return node.isTask ? 'Task' : 'Concept';
  }
  if (col.key === 'updateType' && !fs.value) {
    return node.parentId === null ? 'New Map' : 'New Topic';
  }
  return fs.value || '';
}

function calcFrameworkRowHeight(values) {
  let maxLines = 1;
  values.forEach(val => {
    const text = val === null || val === undefined ? '' : String(val);
    const lines = text.split('\n').length + Math.floor(text.length / 34);
    if (lines > maxLines) maxLines = lines;
  });
  return Math.max(20, Math.min(120, maxLines * 16.5));
}

function excelTextUnits(text = '') {
  return String(text).split('').reduce((sum, ch) => sum + (ch.charCodeAt(0) > 255 ? 2 : 1), 0);
}

function excelCellText(cell) {
  const value = cell.value;
  if (value === null || value === undefined) return '';
  if (typeof value === 'object') {
    if (Array.isArray(value.richText)) return value.richText.map(part => part.text || '').join('');
    if (value.text) return value.text;
    if (value.result !== undefined) return String(value.result);
    if (value.formula) return String(value.result || '');
  }
  return String(value);
}

function countExcelWrappedLines(text, width) {
  const usable = Math.max(4, Math.floor((width || 12) * 1.1));
  return String(text).split('\n').reduce((sum, line) => {
    const units = excelTextUnits(line);
    return sum + Math.max(1, Math.ceil(units / usable));
  }, 0);
}

function autoFitWorksheet(ws, opts = {}) {
  const minWidths = opts.minWidths || [];
  const minWidth = opts.minWidth || 8;
  const maxWidth = opts.maxWidth || 72;
  const minRowHeight = opts.minRowHeight || 20;
  const maxRowHeight = opts.maxRowHeight || 240;
  const desiredWidths = [];

  ws.eachRow({includeEmpty: false}, row => {
    row.eachCell({includeEmpty: false}, (cell, colNumber) => {
      const text = excelCellText(cell);
      const longest = Math.max(...String(text || '').split('\n').map(excelTextUnits), 0);
      const base = minWidths[colNumber - 1] || ws.getColumn(colNumber).width || minWidth;
      desiredWidths[colNumber - 1] = Math.max(desiredWidths[colNumber - 1] || base, base, Math.min(maxWidth, longest + 2));
      cell.alignment = {
        ...(cell.alignment || {}),
        vertical: 'middle',
        wrapText: true,
      };
    });
  });

  for (let c = 1; c <= ws.columnCount; c++) {
    const base = minWidths[c - 1] || ws.getColumn(c).width || minWidth;
    ws.getColumn(c).width = Math.max(minWidth, Math.min(maxWidth, desiredWidths[c - 1] || base));
  }

  ws.eachRow({includeEmpty: false}, row => {
    let maxLines = 1;
    row.eachCell({includeEmpty: false}, (cell, colNumber) => {
      const text = excelCellText(cell);
      const width = ws.getColumn(colNumber).width || minWidth;
      maxLines = Math.max(maxLines, countExcelWrappedLines(text, width));
      cell.alignment = {
        ...(cell.alignment || {}),
        vertical: 'middle',
        wrapText: true,
      };
    });
    row.height = Math.max(minRowHeight, Math.min(maxRowHeight, maxLines * 16.5 + 5));
  });
}

function buildFrameworkSheetExcel(workbook, nodes, enabledFields) {
  const ws = workbook.addWorksheet('用户手册开发框架');
  const dirCols = [
    {key: 'map', label: 'Map*'},
    {key: 'l1', label: '一级目录*'},
    {key: 'l2', label: '二级目录*'},
    {key: 'l3', label: '三级目录'},
    {key: 'l4', label: '四级目录'},
    {key: 'l5', label: '五级目录'},
  ];
  const fixedExtraCols = [
    {key:'infoType',    label:'信息类型*'},
    {key:'updateType',  label:'更新类型*'},
    {key:'version',     label:'版本*'},
    {key:'aggregate',   label:'聚合'},
    {key:'keyPoints',   label:'章节要点*'},
    {key:'competitor',  label:'对应友商'},
    {key:'compDetail',  label:'具体友商可借鉴内容'},
    {key:'materials',   label:'需提供的素材'},
    {key:'matSource',   label:'素材提供方'},
    {key:'matProgress', label:'素材提供进度'},
    {key:'matLocation', label:'素材具体位置'},
    {key:'owner',       label:'中文责任人'},
    {key:'progress',    label:'中文进度*'},
    {key:'dueDate',     label:'中文完成日期*'},
    {key:'remark',      label:'备注'},
  ];
  const customFields = enabledFields.filter(f => f.isCustom).map(f => ({key: f.key, label: f.label, fs: f}));
  const enabledMap = {};
  enabledFields.forEach(f => { enabledMap[f.key] = f; });
  const extraCols = fixedExtraCols
    .filter(col => enabledMap[col.key])
    .map(col => ({...col, fs: enabledMap[col.key]}))
    .concat(customFields);
  const allCols = dirCols.concat(extraCols);

  allCols.forEach((col, idx) => {
    ws.getColumn(idx + 1).width = REF_FRAMEWORK_WIDTHS[idx] || Math.max(12, Math.min(24, String(col.label).length * 1.8));
    setExcelCell(ws.getCell(1, idx + 1), col.label, frameworkHeaderStyle());
  });
  ws.getRow(1).height = 20;
  ws.views = [{state: 'frozen', ySplit: 1}];

  const optionMap = buildFrameworkOptionSheet(workbook, extraCols);

  nodes.forEach((node, idx) => {
    const rowNum = idx + 2;
    const isMapRow = node.parentId === null;
    const style = frameworkBodyStyle(isMapRow);
    const rowValues = [];

    dirCols.forEach((_, dirIdx) => {
      const value = node.level === dirIdx + 1 ? node.title : '';
      rowValues.push(value);
      setExcelCell(ws.getCell(rowNum, dirIdx + 1), value, style);
    });

    extraCols.forEach((col, extraIdx) => {
      const cell = ws.getCell(rowNum, dirCols.length + extraIdx + 1);
      const value = getFrameworkFieldValue(node, idx, col, col.fs);
      rowValues.push(value);
      if (col.key === 'version' && value !== '' && !isNaN(Number(value))) {
        setExcelCell(cell, Number(value), style);
      } else {
        setExcelCell(cell, value, style);
      }

      if (optionMap[col.key]) {
        cell.dataValidation = {
          type: 'list',
          allowBlank: true,
          formulae: [optionMap[col.key]],
          showErrorMessage: true,
          errorTitle: '输入无效',
          error: '请从下拉选项中选择值。',
        };
      }
    });

    ws.getRow(rowNum).height = calcFrameworkRowHeight(rowValues);
  });

  autoFitWorksheet(ws, {
    minWidths: allCols.map((_, idx) => REF_FRAMEWORK_WIDTHS[idx] || 12),
    minRowHeight: 20,
    maxRowHeight: 260,
    maxWidth: 82,
  });
}

async function doExport() {
  const text = document.getElementById('md-editor').value;
  const nodes = parseMd(text);
  if (nodes.length === 0) { showToast('请先输入 Markdown 内容'); return; }
  if (!window.ExcelJS) { showToast('导出失败：ExcelJS 未加载完成'); return; }

  const enabledFields = fieldState.filter(f => f.enabled);

  try {
    const workbook = new ExcelJS.Workbook();
    workbook.creator = 'Codex';
    workbook.created = new Date();

    const ws1 = workbook.addWorksheet('内容策略');
    copyLegacySheetToExcel(buildSheetContentStrategy(), ws1, 'content', REF_CONTENT_WIDTHS);
    autoFitWorksheet(ws1, {minWidths: REF_CONTENT_WIDTHS, minRowHeight: 20, maxRowHeight: 220, maxWidth: 72});

    const ws2 = workbook.addWorksheet('复用策略');
    copyLegacySheetToExcel(buildSheetReuseStrategy(), ws2, 'reuse', REF_REUSE_WIDTHS);
    autoFitWorksheet(ws2, {minWidths: REF_REUSE_WIDTHS, minRowHeight: 20, maxRowHeight: 220, maxWidth: 72});

    buildFrameworkSheetExcel(workbook, nodes, enabledFields);

    const buffer = await workbook.xlsx.writeBuffer();
    const blob = new Blob([buffer], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '文档框架.xlsx';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    closeExportModal();
    showToast('已导出 文档框架.xlsx（含下拉选项）✓');
  } catch (e) {
    console.error(e);
    showToast('导出失败：' + e.message);
  }
}

window.addEventListener('load', () => {
  loadImageAssets();
  activeThemeKey = MAP_THEMES[localStorage.getItem('docFramework_theme')] ? localStorage.getItem('docFramework_theme') : 'default';
  applyThemeChrome();
  updateThemeSelect();

  // Restore from localStorage
  const saved = localStorage.getItem('docFramework_md');
  if (saved) {
    document.getElementById('md-editor').value = saved;
    showToast('已恢复上次编辑内容');
  }

  const savedLayout = localStorage.getItem('docFramework_layout');
  if (savedLayout === 'mindmap' || savedLayout === 'fishbone') {
    mapState.layoutMode = savedLayout;
  }
  updateLayoutSwitch();

  const mindmapBtn = document.getElementById('mindmapLayoutBtn');
  const fishboneBtn = document.getElementById('fishboneLayoutBtn');
  if (mindmapBtn) {
    mindmapBtn.addEventListener('click', () => setMapLayout('mindmap'));
  }
  if (fishboneBtn) {
    fishboneBtn.addEventListener('click', () => setMapLayout('fishbone'));
  }

  const editor = document.getElementById('md-editor');

  const migrated = migrateInlineImageData(editor.value);
  if (migrated.changed) {
    editor.value = migrated.text;
    localStorage.setItem('docFramework_md', editor.value);
    showToast('已将长图片数据替换为短引用');
  }

  // Auto-save
  editor.addEventListener('input', () => {
    localStorage.setItem('docFramework_md', editor.value);
  });

  // ── Image paste support ──
  // Stores pasted images in localStorage and inserts a short asset reference.
  editor.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (!item.type.startsWith('image/')) continue;
      e.preventDefault();
      const file = item.getAsFile();
      const reader = new FileReader();
      reader.onload = (ev) => {
        const dataUrl = ev.target.result;
        const altName = '图片_' + Date.now();
        const assetRef = createImageAssetRef();
        imageAssetStore[assetRef] = dataUrl;
        saveImageAssets();
        const mdImg = `![${altName}](${assetRef})`;
        // Insert at cursor position
        const start = editor.selectionStart;
        const end   = editor.selectionEnd;
        const before = editor.value.slice(0, start);
        const after  = editor.value.slice(end);
        // Make sure image is on its own line
        const prefix = (before.length > 0 && !before.endsWith('\n')) ? '\n' : '';
        const suffix = (after.length > 0 && !after.startsWith('\n')) ? '\n' : '';
        editor.value = before + prefix + mdImg + suffix + after;
        editor.selectionStart = editor.selectionEnd = start + prefix.length + mdImg.length;
        localStorage.setItem('docFramework_md', editor.value);
        showToast('图片已插入（短引用）');
      };
      reader.readAsDataURL(file);
      break; // only handle first image
    }
  });
});
