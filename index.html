<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mard 拼豆图纸工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper:    #F1E6CB;
  --paper-dk: #E5D6B0;
  --ink:      #3A2516;
  --red:      #E5392A;
  --pink:     #E54489;
  --orange:   #F09131;
  --green:    #3D9F47;
  --blue:     #3F8BC4;
  --yellow:   #F0BC2A;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Albert Sans',sans-serif;
  background:var(--ink);
  color:var(--ink);
}

/* ── halftone texture overlay ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:9999;
  opacity:0.10;
  background-image:radial-gradient(circle at 1px 1px,rgba(58,37,22,0.6) 1px,transparent 1.6px);
  background-size:4px 4px;
}

.app{display:flex;height:100vh;overflow:hidden;}

/* ══ SIDEBAR ══ */
.sidebar{
  width:260px;flex-shrink:0;
  background:var(--paper);
  border-right:2px solid var(--ink);
  display:flex;flex-direction:column;
  overflow:hidden;
}
.sidebar-head{
  background:var(--ink);
  color:var(--paper);
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:10px;
}
.sidebar-head .logo{
  font-family:'Big Shoulders Display',sans-serif;
  font-weight:900;font-size:22px;letter-spacing:-0.02em;
  line-height:1;
}
.sidebar-head .logo span{color:var(--pink);}
.sidebar-head .jp{
  font-family:'Noto Sans JP',sans-serif;font-weight:500;
  font-size:11px;opacity:0.7;margin-top:2px;
}

.sb-body{overflow-y:auto;flex:1;display:flex;flex-direction:column;}

.sb-section{
  border-bottom:1.5px solid var(--ink);
  padding:14px 16px;
}
.sb-label{
  font-family:'Albert Sans',sans-serif;font-weight:700;
  text-transform:uppercase;letter-spacing:0.18em;font-size:10px;
  color:var(--ink);opacity:0.6;margin-bottom:10px;
}

/* upload zone */
.upload-zone{
  border:2px dashed var(--ink);border-radius:3px;
  padding:18px 12px;text-align:center;cursor:pointer;
  transition:all .2s;background:var(--paper-dk);
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink);
}
.upload-zone:hover,.upload-zone.drag{
  background:var(--pink);border-color:var(--pink);color:var(--paper);border-style:solid;
}
.upload-zone .icon{font-size:22px;margin-bottom:4px;}

/* row layout */
.row{display:flex;gap:6px;align-items:center;margin-bottom:7px;}
.row label{
  font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;
  color:var(--ink);min-width:22px;letter-spacing:0.04em;
}
input[type=number],select{
  font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:5px 7px;border:1.5px solid var(--ink);border-radius:2px;
  background:var(--paper);color:var(--ink);width:100%;
}
input[type=number]:focus,select:focus{outline:none;border-color:var(--pink);}
input[type=range]{width:100%;accent-color:var(--red);}
input[type=file]{display:none;}

/* lock btn */
.lock-btn{background:none;border:none;cursor:pointer;font-size:13px;opacity:.4;transition:opacity .15s;padding:0;}
.lock-btn.locked{opacity:1;color:var(--red);}

/* buttons */
.btn{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:0.04em;
  padding:8px 16px;border:2px solid var(--ink);
  background:var(--paper);color:var(--ink);cursor:pointer;
  transition:all .15s;width:100%;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{background:var(--ink);color:var(--paper);}
.btn-primary{background:var(--red);border-color:var(--red);color:var(--paper);}
.btn-primary:hover{background:var(--ink);border-color:var(--ink);}
.btn-sm{font-size:12px;padding:5px 11px;width:auto;}
.btn-strip{background:var(--pink);border-color:var(--pink);color:var(--paper);}
.btn-strip:hover{background:var(--ink);border-color:var(--ink);}

/* palette */
.cur-swatch-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.cur-swatch{width:26px;height:26px;border:2px solid var(--ink);flex-shrink:0;}
.cur-info{font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1.4;}
.cur-info .code{font-weight:500;font-size:13px;}
.palette-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;}
.pc{width:100%;aspect-ratio:1;border:1.5px solid transparent;cursor:pointer;position:relative;transition:transform .1s;}
.pc:hover{transform:scale(1.3);z-index:2;border-color:var(--ink);}
.pc.selected{border-color:var(--ink);box-shadow:0 0 0 1px var(--paper),0 0 0 2.5px var(--ink);}
.pc-tip{display:none;position:absolute;bottom:calc(100%+3px);left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:9px;
  padding:2px 5px;white-space:nowrap;z-index:99;pointer-events:none;}
.pc:hover .pc-tip{display:block;}

/* used colors */
.used-list{display:flex;flex-direction:column;gap:4px;max-height:240px;overflow-y:auto;}
.uc-row{
  display:flex;align-items:center;gap:7px;padding:4px 8px;
  border:1.5px solid var(--ink);cursor:pointer;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  background:var(--paper);transition:background .12s;
}
.uc-row:hover{background:var(--paper-dk);}
.uc-swatch{width:14px;height:14px;border:1px solid rgba(58,37,22,0.3);flex-shrink:0;}
.uc-code{font-weight:500;min-width:30px;}
.uc-count{margin-left:auto;opacity:0.6;}
.chip{
  font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:500;
  padding:1px 6px;letter-spacing:0.06em;color:var(--paper);
}
.chip-ok{background:var(--green);}
.chip-miss{background:var(--red);}

/* tag */
.tag{
  font-family:'JetBrains Mono',monospace;font-size:10px;
  padding:1px 7px;border:1.5px solid var(--ink);
  display:inline-block;
}

/* ══ MAIN ══ */
.main{flex:1;overflow:hidden;display:flex;flex-direction:column;background:var(--paper);}

/* tab bar */
.tabbar{
  background:var(--ink);
  display:flex;gap:0;padding:0 16px;
  border-bottom:2px solid var(--ink);
  flex-shrink:0;
}
.tab-btn{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:13px;
  letter-spacing:0.06em;padding:12px 20px;
  border:none;border-bottom:3px solid transparent;
  background:transparent;color:rgba(241,230,203,0.5);
  cursor:pointer;transition:all .15s;margin-bottom:-2px;
}
.tab-btn.active{color:var(--paper);border-bottom-color:var(--pink);}
.tab-btn:hover:not(.active){color:var(--paper);}

.panel{display:none;flex:1;overflow:hidden;flex-direction:column;}
.panel.active{display:flex;}

/* ── EDITOR ── */
.toolbar{
  background:var(--paper-dk);border-bottom:1.5px solid var(--ink);
  padding:7px 14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex-shrink:0;
}
.tool-btn{
  font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;
  padding:4px 12px;border:1.5px solid var(--ink);
  background:var(--paper);cursor:pointer;transition:all .15s;color:var(--ink);
  letter-spacing:0.06em;
}
.tool-btn.active{background:var(--ink);color:var(--paper);}
.tool-btn:hover:not(.active){background:var(--paper-dk);}
.tool-sep{width:1px;height:20px;background:var(--ink);opacity:0.3;flex-shrink:0;}

/* canvas area */
.canvas-outer{
  flex:1;overflow:hidden;position:relative;
  background:#D8CDB8;
  background-image:radial-gradient(circle at 1px 1px,rgba(58,37,22,0.2) 1px,transparent 0);
  background-size:16px 16px;
}
.canvas-inner{position:absolute;inset:0;overflow:hidden;cursor:grab;}
.canvas-inner.grabbing{cursor:grabbing;}
.canvas-viewport{position:absolute;transform-origin:0 0;}
#beadCanvas{display:block;image-rendering:pixelated;}

/* zoom HUD — cassette label style */
.zoom-hud{
  position:absolute;bottom:14px;right:16px;
  display:none;align-items:center;gap:4px;
  background:var(--ink);color:var(--paper);
  padding:4px 10px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
}
.zoom-hud button{
  background:none;border:none;cursor:pointer;
  color:var(--paper);font-size:15px;padding:0 3px;line-height:1;
}
.zoom-hud button:hover{color:var(--pink);}
#zoomLabel{min-width:40px;text-align:center;letter-spacing:0.04em;}

/* empty state */
.empty-state{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;
}
.empty-state .big{font-size:48px;}
.empty-state .msg{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;
  font-size:20px;color:var(--ink);letter-spacing:-0.01em;
}
.empty-state .sub{font-size:13px;color:var(--ink);opacity:0.6;}

/* stats bar */
.stats-bar{
  background:var(--ink);color:var(--paper);
  padding:6px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;
  display:none;align-items:center;gap:20px;flex-wrap:wrap;flex-shrink:0;
  letter-spacing:0.04em;
}
.stats-bar .stat-label{opacity:0.5;margin-right:4px;}
.stats-bar b{font-weight:500;}

/* ── color legend below export ── */
.legend-bar{
  background:var(--paper-dk);border-top:1.5px solid var(--ink);
  padding:10px 16px;display:none;gap:6px;flex-wrap:wrap;align-items:center;flex-shrink:0;
  max-height:110px;overflow-y:auto;
}
.legend-item{
  display:flex;align-items:center;gap:5px;
  font-family:'JetBrains Mono',monospace;font-size:10px;
  border:1px solid var(--ink);padding:2px 7px 2px 4px;
  background:var(--paper);
}
.legend-swatch{width:12px;height:12px;border:1px solid rgba(58,37,22,0.3);flex-shrink:0;}
.legend-count{opacity:0.6;margin-left:3px;}

/* bg exclude toggle */
.bg-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.bg-swatch{width:18px;height:18px;border:2px solid var(--ink);flex-shrink:0;}

/* ── INVENTORY ── */
.inv-head{
  background:var(--ink);color:var(--paper);
  padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;
}
.inv-head .title{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:18px;
  letter-spacing:-0.01em;
}
.add-bar{
  background:var(--paper-dk);border-bottom:1.5px solid var(--ink);
  padding:10px 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex-shrink:0;
}
.add-bar .field-label{
  font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;
  text-transform:uppercase;letter-spacing:0.12em;
}
.add-bar select{width:80px;}
.add-bar input[type=number]{width:64px;}
.bottle-shelf{padding:20px 22px;overflow-y:auto;flex:1;}
.shelf-empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  height:180px;gap:8px;
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:16px;
  color:var(--ink);opacity:0.5;
}
.shelf-grid{display:flex;flex-wrap:wrap;gap:10px 6px;}
.bottle-card{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  width:74px;position:relative;cursor:default;
}
.bottle-card img{width:62px;height:76px;object-fit:cover;object-position:top;border:1.5px solid var(--ink);}
.bottle-label{
  font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:12px;
  letter-spacing:0.02em;color:var(--ink);
}
.bottle-remove{
  position:absolute;top:-5px;right:0;
  width:18px;height:18px;
  background:var(--red);color:var(--paper);border:none;cursor:pointer;
  font-size:13px;display:none;align-items:center;justify-content:center;line-height:1;z-index:2;
  font-weight:bold;
}
.bottle-card:hover .bottle-remove{display:flex;}

/* ── SHOPPING ── */
.shop-head{
  background:var(--ink);color:var(--paper);
  padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0;
}
.shop-head .title{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:18px;letter-spacing:-0.01em;
}
.shop-wrap{padding:18px 20px;overflow-y:auto;flex:1;}
.shop-section{margin-bottom:20px;}
.shop-sec-title{
  font-family:'Big Shoulders Display',sans-serif;font-weight:900;font-size:16px;
  letter-spacing:-0.01em;color:var(--ink);
  border-bottom:2px solid var(--ink);padding-bottom:6px;margin-bottom:10px;
  display:flex;align-items:center;gap:10px;
}
.shop-row{
  display:flex;align-items:center;gap:10px;padding:7px 10px;
  border:1.5px solid var(--ink);margin-bottom:4px;
  font-family:'JetBrains Mono',monospace;font-size:11px;
  background:var(--paper);
}
.shop-row:hover{background:var(--paper-dk);}
.shop-swatch{width:16px;height:16px;border:1px solid rgba(58,37,22,0.3);flex-shrink:0;}
</style>
</head>
<body>
<div class="app">

<!-- ══ SIDEBAR ══ -->
<aside class="sidebar">
  <div class="sidebar-head">
    <div>
      <div class="logo">mard<span>·</span>拼豆</div>
      <div class="jp">ビーズ図案ツール</div>
    </div>
  </div>
  <div class="sb-body">

    <div class="sb-section">
      <div class="sb-label">上传图片</div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📷</div>
        <div>点击或拖拽图片</div>
        <div style="opacity:0.6;margin-top:2px">PNG · JPG · WebP</div>
      </div>
      <input type="file" id="fileInput" accept="image/*">
    </div>

    <div class="sb-section">
      <div class="sb-label">图纸尺寸</div>
      <div class="row">
        <label>宽</label>
        <input type="number" id="gridW" value="32" min="8" max="128" style="width:50px" oninput="onWChange()">
        <button class="lock-btn locked" id="lockBtn" onclick="toggleLock()" title="锁定比例">🔒</button>
        <input type="number" id="gridH" value="32" min="8" max="128" style="width:50px" oninput="onHChange()">
        <label>高</label>
      </div>
      <div style="margin-top:4px;display:flex;gap:6px">
        <button class="btn btn-primary" onclick="generatePattern()" style="flex:1">▶ 生成图纸</button>
      </div>
      <div style="margin-top:6px;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="exportPNG()">导出PNG</button>
        <button class="btn btn-sm btn-strip" onclick="initBlankCanvas()">新建空白</button>
        <button class="btn btn-sm" onclick="clearCanvas()">清空</button>
      </div>
      <!-- background exclude -->
      <div class="bg-row">
        <label style="font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.1em;cursor:pointer">
          <input type="checkbox" id="excludeBg" style="margin-right:5px">排除背景色
        </label>
        <div class="bg-swatch" id="bgSwatch" style="background:#fff;display:none" title="当前背景色"></div>
        <span id="bgCode" style="font-family:'JetBrains Mono',monospace;font-size:10px;display:none"></span>
      </div>
    </div>

    <div class="sb-section">
      <div class="sb-label">当前颜色</div>
      <div class="cur-swatch-row">
        <div class="cur-swatch" id="curSwatch"></div>
        <div class="cur-info">
          <div class="code" id="curCode">—</div>
          <div id="curHex" style="opacity:0.6;font-family:'JetBrains Mono',monospace;font-size:10px">—</div>
        </div>
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>

    <div class="sb-section" style="flex:1">
      <div class="sb-label" style="display:flex;justify-content:space-between;align-items:center">
        <span>图纸用色</span>
        <span id="colorCountBadge" class="tag">0色</span>
      </div>
      <div class="used-list" id="usedList">
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.5;text-align:center;padding:10px">生成图纸后显示</div>
      </div>
    </div>

  </div>
</aside>

<!-- ══ MAIN ══ -->
<main class="main">
  <div class="tabbar">
    <button class="tab-btn active" onclick="switchTab('editor')">图纸编辑</button>
    <button class="tab-btn" onclick="switchTab('inventory')">补货清单</button>
    <button class="tab-btn" onclick="switchTab('shopping')">图纸缺货</button>
  </div>

  <!-- EDITOR -->
  <div class="panel active" id="panel-editor">
    <div class="toolbar">
      <button class="tool-btn active" id="toolDraw" onclick="setTool('draw')">✏ 画笔</button>
      <button class="tool-btn" id="toolErase" onclick="setTool('erase')">✕ 橡皮</button>
      <button class="tool-btn" id="toolFill" onclick="setTool('fill')">◈ 填充</button>
      <button class="tool-btn" id="toolPick" onclick="setTool('pick')">◎ 取色</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" onclick="undo()">↩ 撤销</button>
      <div class="tool-sep"></div>
      <label style="font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;letter-spacing:0.06em">
        <input type="checkbox" id="showGrid" checked onchange="redraw()">网格
      </label>
      <label style="font-family:'Albert Sans',sans-serif;font-weight:700;font-size:11px;display:flex;align-items:center;gap:4px;cursor:pointer;letter-spacing:0.06em">
        <input type="checkbox" id="showCodes" onchange="redraw()">色号
      </label>
      <div class="tool-sep"></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;opacity:0.5">滚轮缩放 · 中键平移</span>
    </div>

    <div class="canvas-outer" id="canvasOuter">
      <div class="empty-state" id="emptyState">
        <div class="big">🫘</div>
        <div class="msg">上传图片，生成图纸</div>
        <div class="sub">或点击下方新建空白画布</div>
      </div>
      <div class="canvas-inner" id="canvasInner">
        <div class="canvas-viewport" id="canvasViewport">
          <canvas id="beadCanvas"></canvas>
        </div>
      </div>
      <div class="zoom-hud" id="zoomHud">
        <button onclick="zoomBy(-0.25)">−</button>
        <span id="zoomLabel">100%</span>
        <button onclick="zoomBy(0.25)">+</button>
        <button onclick="resetView()" style="font-size:11px;padding:0 4px">⊡</button>
      </div>
    </div>

    <div class="stats-bar" id="statsBar">
      <span><span class="stat-label">SIZE</span><b id="statSize">—</b></span>
      <span><span class="stat-label">BEADS</span><b id="statTotal">—</b></span>
      <span><span class="stat-label">COLORS</span><b id="statColors">—</b></span>
    </div>

    <!-- color legend strip -->
    <div class="legend-bar" id="legendBar"></div>
  </div>

  <!-- INVENTORY -->
  <div class="panel" id="panel-inventory">
    <div class="inv-head">
      <div class="title">補 貨 清 單</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.6;margin-left:4px">下次需要补货的颜色</div>
      <div style="margin-left:auto;display:flex;gap:6px">
        <button class="btn btn-sm" onclick="exportInventory()">导出</button>
        <button class="btn btn-sm" onclick="clearAllInventory()" style="color:var(--red)">清空全部</button>
      </div>
    </div>
    <div class="add-bar">
      <span class="field-label">系列</span>
      <select id="seriesSelect" style="width:80px"></select>
      <span class="field-label" style="margin-left:8px">编号</span>
      <input type="number" id="numInput" min="1" max="99" placeholder="12">
      <button class="btn btn-primary btn-sm" onclick="addToInventory()">+ 添加</button>
    </div>
    <div class="bottle-shelf" id="bottleShelf">
      <div class="shelf-empty"><div style="font-size:36px">📋</div><div>还没有补货记录</div></div>
    </div>
  </div>

  <!-- SHOPPING -->
  <div class="panel" id="panel-shopping">
    <div class="shop-head">
      <div class="title">圖 紙 缺 貨</div>
      <div style="font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.6;margin-left:4px">图纸用色中补货清单没有的颜色</div>
      <button class="btn btn-sm" onclick="exportShoppingList()" style="margin-left:auto">导出文本</button>
    </div>

// ── UPLOAD ──
function setupUpload(){
  const zone=document.getElementById('uploadZone'),inp=document.getElementById('fileInput');
  zone.addEventListener('dragover',e=>{e.preventDefault();zone.classList.add('drag');});
  zone.addEventListener('dragleave',()=>zone.classList.remove('drag'));

  inp.addEventListener('change',()=>{if(inp.files[0])processFile(inp.files[0]);});
}
function processFile(file){
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{window._img=img;uploadedAspect=img.width/img.height;if(aspectLocked)document.getElementById('gridH').value=Math.max(1,Math.round((+document.getElementById('gridW').value||32)/uploadedAspect));generatePattern();};img.src=e.target.result;};
  r.readAsDataURL(file);
}

// ── GENERATE ──
function generatePattern(){
  if(!window._img){alert('请先上传图片');return;}
  gridW=+document.getElementById('gridW').value||32;
  gridH=+document.getElementById('gridH').value||32;
  const off=document.createElement('canvas');off.width=gridW;off.height=gridH;
  const ctx=off.getContext('2d');ctx.drawImage(window._img,0,0,gridW,gridH);
  const data=ctx.getImageData(0,0,gridW,gridH),newGrid=[];
  for(let y=0;y<gridH;y++){newGrid[y]=[];for(let x=0;x<gridW;x++){
    const i=(y*gridW+x)*4,r=data.data[i],g=data.data[i+1],b=data.data[i+2],a=data.data[i+3];
    if(a<30){newGrid[y][x]=null;continue;}
    newGrid[y][x]=findNearest(r,g,b);
  }}
  // Detect background: most common corner color
  const corners=[newGrid[0]?.[0],newGrid[0]?.[gridW-1],newGrid[gridH-1]?.[0],newGrid[gridH-1]?.[gridW-1]].filter(Boolean);
  const freq={};corners.forEach(c=>{freq[c]=(freq[c]||0)+1;});
  bgColor=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0]?.[0]||null;
  if(bgColor){
    document.getElementById('bgSwatch').style.background=MARD_COLORS[bgColor];
    document.getElementById('bgSwatch').style.display='block';
    document.getElementById('bgCode').textContent=bgColor;
    document.getElementById('bgCode').style.display='';
  }
  pushUndo();grid=newGrid;showCanvas();updateStats();
}
function findNearest(r,g,b){let best=null,bd=Infinity;for(const c of COLOR_ARRAY){const d=colorDist({r,g,b},c.rgb);if(d<bd){bd=d;best=c.code;}}return best;}
function colorDist(a,b){return(a.r-b.r)**2+(a.g-b.g)**2+(a.b-b.b)**2;}

// ── CANVAS ──
function showCanvas(){
  document.getElementById('emptyState').style.display='none';
  document.getElementById('statsBar').style.display='flex';
  document.getElementById('zoomHud').style.display='flex';
  const canvas=document.getElementById('beadCanvas');
  canvas.width=gridW*cellSize;canvas.height=gridH*cellSize;
  setupCanvasDrawEvents(canvas);redraw();resetView();
}
function initBlankCanvas(){
  gridW=+document.getElementById('gridW').value||32;
  gridH=+document.getElementById('gridH').value||32;
  grid=Array.from({length:gridH},()=>Array(gridW).fill(null));
  bgColor=null;
  document.getElementById('bgSwatch').style.display='none';
  document.getElementById('bgCode').style.display='none';
  showCanvas();updateStats();
}
function clearCanvas(){if(!confirm('确认清空？'))return;pushUndo();grid=Array.from({length:gridH},()=>Array(gridW).fill(null));redraw();updateStats();}

function redraw(){
  const canvas=document.getElementById('beadCanvas');
  if(!canvas||!canvas.width)return;
  const ctx=canvas.getContext('2d'),cs=cellSize;
  const sg=document.getElementById('showGrid').checked;
  const sc=document.getElementById('showCodes').checked;
  const excludeBg=document.getElementById('excludeBg').checked;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
    const code=grid[y]&&grid[y][x];
    const isBg=excludeBg&&code===bgColor;
    if(isBg){
      // Show as hatched empty
      ctx.fillStyle='#E8E3D8';ctx.fillRect(x*cs,y*cs,cs,cs);
      ctx.strokeStyle='rgba(58,37,22,0.12)';ctx.lineWidth=0.5;
      ctx.beginPath();ctx.moveTo(x*cs,y*cs);ctx.lineTo(x*cs+cs,y*cs+cs);ctx.stroke();
    } else {
      ctx.fillStyle=code?MARD_COLORS[code]:'#E8E3D8';
      ctx.fillRect(x*cs,y*cs,cs,cs);
      if(sc&&code&&cs>=12){
        const bright=getBrightness(MARD_COLORS[code]);
        ctx.fillStyle=bright>140?'#3A2516':'#F1E6CB';
        const fs=Math.max(7,Math.min(cs*0.34,12));
        ctx.font=`bold ${fs}px "JetBrains Mono",monospace`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(code,x*cs+cs/2,y*cs+cs/2);
      }
    }
  }
  if(sg&&cs>=4){
    ctx.strokeStyle='rgba(58,37,22,0.15)';ctx.lineWidth=0.5;
    for(let x=0;x<=gridW;x++){ctx.beginPath();ctx.moveTo(x*cs,0);ctx.lineTo(x*cs,gridH*cs);ctx.stroke();}
    for(let y=0;y<=gridH;y++){ctx.beginPath();ctx.moveTo(0,y*cs);ctx.lineTo(gridW*cs,y*cs);ctx.stroke();}
  }
}

// ── PAN/ZOOM ──
function setupPanZoom(){
  const inner=document.getElementById('canvasInner');
  inner.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=inner.getBoundingClientRect();
    applyZoom(scale*(e.deltaY<0?1.15:0.87),e.clientX-rect.left,e.clientY-rect.top);
  },{passive:false});
  inner.addEventListener('mousedown',e=>{
    if(e.button===1||e.button===2){e.preventDefault();isPanning=true;lastMouse={x:e.clientX,y:e.clientY};inner.classList.add('grabbing');}
  });
  window.addEventListener('mousemove',e=>{
    if(isPanning&&lastMouse){panX+=e.clientX-lastMouse.x;panY+=e.clientY-lastMouse.y;lastMouse={x:e.clientX,y:e.clientY};applyTransform();}
  });
  window.addEventListener('mouseup',e=>{if(e.button===1||e.button===2){isPanning=false;lastMouse=null;document.getElementById('canvasInner').classList.remove('grabbing');}});
  inner.addEventListener('contextmenu',e=>e.preventDefault());
  // Pinch
  let initDist=0,initScale=1,pinchC={x:0,y:0};
  inner.addEventListener('touchstart',e=>{
    if(e.touches.length===2){e.preventDefault();const t0=e.touches[0],t1=e.touches[1];initDist=Math.hypot(t1.clientX-t0.clientX,t1.clientY-t0.clientY);initScale=scale;const rect=inner.getBoundingClientRect();pinchC={x:(t0.clientX+t1.clientX)/2-rect.left,y:(t0.clientY+t1.clientY)/2-rect.top};}
    else if(e.touches.length===1)lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};
  },{passive:false});
  inner.addEventListener('touchmove',e=>{
    if(e.touches.length===2){e.preventDefault();const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);applyZoom(Math.min(8,Math.max(0.1,initScale*d/initDist)),pinchC.x,pinchC.y);}
    else if(e.touches.length===1&&lastMouse){panX+=e.touches[0].clientX-lastMouse.x;panY+=e.touches[0].clientY-lastMouse.y;lastMouse={x:e.touches[0].clientX,y:e.touches[0].clientY};applyTransform();}
  },{passive:false});
  inner.addEventListener('touchend',e=>{if(e.touches.length<2)lastMouse=null;});
}
function applyZoom(ns,px,py){const c=Math.min(8,Math.max(0.08,ns));panX=px-(px-panX)*(c/scale);panY=py-(py-panY)*(c/scale);scale=c;applyTransform();}
function applyTransform(){document.getElementById('canvasViewport').style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;document.getElementById('zoomLabel').textContent=Math.round(scale*100)+'%';}
function zoomBy(d){const inner=document.getElementById('canvasInner'),r=inner.getBoundingClientRect();applyZoom(scale+d,r.width/2,r.height/2);}
function resetView(){const inner=document.getElementById('canvasInner'),canvas=document.getElementById('beadCanvas');if(!canvas.width)return;const s=Math.min((inner.clientWidth-40)/canvas.width,(inner.clientHeight-40)/canvas.height,2);scale=s;panX=(inner.clientWidth-canvas.width*s)/2;panY=(inner.clientHeight-canvas.height*s)/2;applyTransform();}

// ── DRAW EVENTS ──
function setupCanvasDrawEvents(canvas){
  const vp=document.getElementById('canvasViewport');
  vp.onmousedown=e=>{if(e.button!==0)return;isDrawing=true;pushUndo();handlePaint(e);};
  vp.onmousemove=e=>{if(isDrawing&&e.buttons===1)handlePaint(e);};
  vp.onmouseup=()=>{isDrawing=false;updateStats();};
  vp.onmouseleave=()=>{if(isDrawing){isDrawing=false;updateStats();}};
}
function handlePaint(e){
  const canvas=document.getElementById('beadCanvas'),rect=canvas.getBoundingClientRect();
  paint(Math.floor((e.clientX-rect.left)/rect.width*gridW),Math.floor((e.clientY-rect.top)/rect.height*gridH));
}
function paint(x,y){
  if(x<0||x>=gridW||y<0||y>=gridH||!grid[y])return;
  if(tool==='draw'){grid[y][x]=selectedColor;redraw();}
  else if(tool==='erase'){grid[y][x]=null;redraw();}
  else if(tool==='pick'){const c=grid[y][x];if(c){selectColor(c);setTool('draw');}}
  else if(tool==='fill'){floodFill(x,y,grid[y][x],selectedColor);redraw();updateStats();}
}
function floodFill(x,y,t,n){if(t===n||x<0||x>=gridW||y<0||y>=gridH||grid[y][x]!==t)return;grid[y][x]=n;floodFill(x+1,y,t,n);floodFill(x-1,y,t,n);floodFill(x,y+1,t,n);floodFill(x,y-1,t,n);}
function setTool(t){tool=t;['draw','erase','fill','pick'].forEach(id=>document.getElementById('tool'+id[0].toUpperCase()+id.slice(1))?.classList.toggle('active',id===t));}
function pushUndo(){undoStack.push(JSON.parse(JSON.stringify(grid)));if(undoStack.length>30)undoStack.shift();}
function undo(){if(!undoStack.length)return;grid=undoStack.pop();redraw();updateStats();}

// ── STATS + LEGEND ──
function updateStats(){
  const excludeBg=document.getElementById('excludeBg').checked;
  usedInPattern={};let total=0;
  for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
    const c=grid[y]&&grid[y][x];
    if(c&&!(excludeBg&&c===bgColor)){usedInPattern[c]=(usedInPattern[c]||0)+1;total++;}
  }
  document.getElementById('statSize').textContent=`${gridW}×${gridH}`;
  document.getElementById('statTotal').textContent=total.toLocaleString();
  document.getElementById('statColors').textContent=Object.keys(usedInPattern).length;
  document.getElementById('colorCountBadge').textContent=Object.keys(usedInPattern).length+'色';
  renderUsedColors();
  renderLegend();
}

function renderUsedColors(){
  const list=document.getElementById('usedList');
  const entries=Object.entries(usedInPattern).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){list.innerHTML='<div style="font-family:\'JetBrains Mono\',monospace;font-size:11px;opacity:0.5;text-align:center;padding:10px">暂无数据</div>';return;}
  list.innerHTML=entries.map(([code,cnt])=>{
    const has=inventory.has(code);
    return `<div class="uc-row" onclick="selectColor('${code}');setTool('draw')">
      <div class="uc-swatch" style="background:${MARD_COLORS[code]}"></div>
      <span class="uc-code">${code}</span>
      <span class="uc-count">${cnt}</span>
      <span class="chip ${has?'chip-ok':'chip-miss'}">${has?'有':'缺'}</span>
    </div>`;
  }).join('');
}

function renderLegend(){
  const bar=document.getElementById('legendBar');
  const entries=Object.entries(usedInPattern).sort((a,b)=>b[1]-a[1]);
  if(!entries.length){bar.style.display='none';return;}
  bar.style.display='flex';
  bar.innerHTML=entries.map(([code,cnt])=>
    `<div class="legend-item">
      <div class="legend-swatch" style="background:${MARD_COLORS[code]}"></div>
      <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:12px">${code}</span>
      <span class="legend-count">×${cnt}</span>
    </div>`).join('');
}

// ── EXPORT PNG (with legend) ──
function exportPNG(){
  const canvas=document.getElementById('beadCanvas');
  if(!canvas||!canvas.width){alert('先生成图纸');return;}
  const excludeBg=document.getElementById('excludeBg').checked;
  const cs=64;
  const entries=Object.entries(usedInPattern).sort((a,b)=>b[1]-a[1]);
  // Legend height: rows of items
  const itemW=120,itemH=28,legendPad=20,legendCols=Math.floor((gridW*cs)/itemW)||1;
  const legendRows=Math.ceil(entries.length/legendCols);
  const legendH=legendRows*(itemH+4)+legendPad*2+30; // 30 for header

  const exp=document.createElement('canvas');
  exp.width=gridW*cs;
  exp.height=gridH*cs+legendH;
  const ctx=exp.getContext('2d');
  ctx.imageSmoothingEnabled=false;

  // Draw grid
  for(let y=0;y<gridH;y++)for(let x=0;x<gridW;x++){
    const code=grid[y]&&grid[y][x];
    const isBg=excludeBg&&code===bgColor;
    if(isBg){ctx.fillStyle='#E8E3D8';ctx.fillRect(x*cs,y*cs,cs,cs);}
    else{
      ctx.fillStyle=code?MARD_COLORS[code]:'#E8E3D8';ctx.fillRect(x*cs,y*cs,cs,cs);
      if(code){
        const bright=getBrightness(MARD_COLORS[code]);
        ctx.fillStyle=bright>140?'#3A2516':'#F1E6CB';
        const fs=Math.round(cs*0.30);
        ctx.font=`bold ${fs}px "Courier New",monospace`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(code,x*cs+cs/2,y*cs+cs/2);
      }
    }
  }
  // Grid lines
  ctx.strokeStyle='rgba(58,37,22,0.15)';ctx.lineWidth=1;
  for(let x=0;x<=gridW;x++){ctx.beginPath();ctx.moveTo(x*cs,0);ctx.lineTo(x*cs,gridH*cs);ctx.stroke();}
  for(let y=0;y<=gridH;y++){ctx.beginPath();ctx.moveTo(0,y*cs);ctx.lineTo(gridW*cs,y*cs);ctx.stroke();}

  // Legend area
  const ly=gridH*cs;
  ctx.fillStyle='#F1E6CB';ctx.fillRect(0,ly,exp.width,legendH);
  ctx.strokeStyle='#3A2516';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(exp.width,ly);ctx.stroke();

  // Legend title
  ctx.fillStyle='#3A2516';
  ctx.font='bold 22px "Courier New",monospace';
  ctx.textAlign='left';ctx.textBaseline='top';
  ctx.fillText(`用色清单 — ${entries.length}色 / 共${Object.values(usedInPattern).reduce((a,b)=>a+b,0)}颗`,legendPad,ly+legendPad);

  // Legend items
  entries.forEach(([code,cnt],i)=>{
    const col=i%legendCols, row=Math.floor(i/legendCols);
    const ix=legendPad+col*itemW, iy=ly+legendPad+30+row*(itemH+4);
    // Swatch
    ctx.fillStyle=MARD_COLORS[code];
    ctx.fillRect(ix,iy,itemH,itemH);
    ctx.strokeStyle='#3A2516';ctx.lineWidth=1;
    ctx.strokeRect(ix,iy,itemH,itemH);
    // Text
    ctx.fillStyle='#3A2516';
    ctx.font=`bold 16px "Courier New",monospace`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(`${code}`,ix+itemH+6,iy+itemH/2);
    ctx.fillStyle='rgba(58,37,22,0.55)';
    ctx.font=`14px "Courier New",monospace`;
    ctx.fillText(`×${cnt}`,ix+itemH+6+38,iy+itemH/2);
  });

  const a=document.createElement('a');a.download=`mard-${gridW}x${gridH}.png`;a.href=exp.toDataURL('image/png');a.click();
}

// ── INVENTORY ──
function populateSeriesSelect(){
  const sel=document.getElementById('seriesSelect');
  Object.keys(SERIES_MAP).forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o);});
}
function addToInventory(){
  const s=document.getElementById('seriesSelect').value;
  const n=parseInt(document.getElementById('numInput').value);
  if(!s||!n){alert('请填写系列和编号');return;}
  const code=s+n;
  if(!MARD_COLORS[code]){alert(`色号 ${code} 不存在`);return;}
  if(inventory.has(code)){alert(`${code} 已在清单中`);return;}
  inventory.add(code);saveInventory();renderBottleShelf();renderUsedColors();
  document.getElementById('numInput').value='';
}
function removeFromInventory(code){inventory.delete(code);saveInventory();renderBottleShelf();renderUsedColors();}
function clearAllInventory(){if(!inventory.size)return;if(!confirm('确认清空全部补货记录？'))return;inventory.clear();saveInventory();renderBottleShelf();renderUsedColors();}

function renderBottleShelf(){
  const shelf=document.getElementById('bottleShelf');
  if(!inventory.size){shelf.innerHTML='<div class="shelf-empty"><div style="font-size:36px">📋</div><div>还没有补货记录</div></div>';return;}
  const codes=[...inventory].sort((a,b)=>COLOR_CODES.indexOf(a)-COLOR_CODES.indexOf(b));
  shelf.innerHTML=`<div class="shelf-grid">${codes.map(code=>{
    const img=BOTTLE_IMGS[code];
    return `<div class="bottle-card">
      ${img?`<img src="${img}" alt="${code}">`:`<div style="width:62px;height:76px;background:${MARD_COLORS[code]};border:1.5px solid #3A2516;display:flex;align-items:center;justify-content:center;font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:11px">${code}</div>`}
      <div class="bottle-label">${code}</div>
      <button class="bottle-remove" onclick="removeFromInventory('${code}')">×</button>
    </div>`;
  }).join('')}</div>`;
}

// ── SHOPPING LIST ──
function renderShoppingList(){
  const container=document.getElementById('shopList');
  const missing=Object.keys(usedInPattern).filter(c=>!inventory.has(c));
  if(!Object.keys(usedInPattern).length){
    container.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;opacity:0.5"><div style="font-size:36px">🛍️</div><div style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:16px">先生成图纸再查看</div></div>';return;
  }
  if(!missing.length){
    container.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px;opacity:0.5"><div style="font-size:36px">✅</div><div style="font-family:\'Big Shoulders Display\',sans-serif;font-weight:700;font-size:16px">补货清单包含所有图纸用色！</div></div>';return;
  }
  const rows=missing.sort((a,b)=>usedInPattern[b]-usedInPattern[a]).map(code=>{
    const img=BOTTLE_IMGS[code];
    return `<div class="shop-row">
      ${img?`<img src="${img}" style="width:18px;height:22px;object-fit:cover;object-position:top;border:1px solid #3A2516">`:''}
      <div class="shop-swatch" style="background:${MARD_COLORS[code]}"></div>
      <span style="font-family:'Big Shoulders Display',sans-serif;font-weight:700;font-size:14px">${code}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;opacity:0.5">${MARD_COLORS[code]}</span>
      <span style="margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:11px;opacity:0.6">${usedInPattern[code]}颗</span>
    </div>`;
  }).join('');
  container.innerHTML=`<div class="shop-section">
    <div class="shop-sec-title">需要购买
      <span style="background:var(--red);color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:400;padding:2px 10px">${missing.length}色</span>
    </div>${rows}
  </div>`;
}

// ── EXPORT / SAVE ──
function exportInventory(){
  const lines=['mard 补货清单','---',...[...inventory].sort()];
  const blob=new Blob([lines.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');a.download='mard-restock.txt';a.href=URL.createObjectURL(blob);a.click();
}
function exportShoppingList(){
  const missing=Object.keys(usedInPattern).filter(c=>!inventory.has(c));
  const lines=['mard 图纸缺货清单','---',...missing.sort().map(c=>`${c}  (图纸需 ${usedInPattern[c]} 颗)`)];
  const blob=new Blob([lines.join('\n')],{type:'text/plain'});
  const a=document.createElement('a');a.download='mard-missing.txt';a.href=URL.createObjectURL(blob);a.click();
}
function saveInventory(){try{localStorage.setItem('mard_v5',JSON.stringify([...inventory]));}catch{}}
function loadInventory(){try{const s=localStorage.getItem('mard_v5');if(s)inventory=new Set(JSON.parse(s));}catch{}}

// ── HELPERS ──
function hexToRgb(hex){const n=parseInt(hex.slice(1),16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255};}
function getBrightness(hex){const{r,g,b}=hexToRgb(hex);return 0.299*r+0.587*g+0.114*b;}

init();
</script>
